<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0e6b49"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Snatch Calc"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon.svg" type="image/svg+xml"><style>html{background:var(--bg)}body{margin-left:auto;margin-right:auto}:root{padding-top:env(safe-area-inset-top,0px)}</style><title>Sorare Snatch Calculator</title>
<style>
/* Terrain : fond craie à reflet vert, vert pelouse en accent, bleu acier = DEF, vermillon = ATK, ambre = donnée manquante */
:root {
  --bg: #edf1ec; --surface: #ffffff; --surface2: #f5f8f4; --ink: #14201a; --muted: #5a6a61; --line: #d6ded7;
  --accent: #0e6b49; --accent-ink: #ffffff; --accent-soft: #dcefe6;
  --def: #1b5fa6; --def-soft: #e0ecf8; --atk: #bf3f10; --atk-soft: #fbe6dc;
  --warn: #8a5100; --warn-soft: #fdf0d3; --warn-line: #e9c777;
  --bad: #b3261e; --bad-soft: #fbe4e1; --ok: #0e6b49; --ok-soft: #dcefe6;
  --shadow: 0 1px 2px rgba(20, 32, 26, .06), 0 4px 14px rgba(20, 32, 26, .05);
  --f-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-num: 'Barlow Condensed', 'Barlow', system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1511; --surface: #15211b; --surface2: #1a2922; --ink: #e5eee8; --muted: #94a69b; --line: #26382d;
    --accent: #48c18c; --accent-ink: #06130d; --accent-soft: #17382a;
    --def: #7db4ee; --def-soft: #16304b; --atk: #ff9a6e; --atk-soft: #4a2415;
    --warn: #f0c36a; --warn-soft: #382b10; --warn-line: #6b5420;
    --bad: #ff8f86; --bad-soft: #3d1a17; --ok: #48c18c; --ok-soft: #17382a;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1511; --surface: #15211b; --surface2: #1a2922; --ink: #e5eee8; --muted: #94a69b; --line: #26382d;
  --accent: #48c18c; --accent-ink: #06130d; --accent-soft: #17382a;
  --def: #7db4ee; --def-soft: #16304b; --atk: #ff9a6e; --atk-soft: #4a2415;
  --warn: #f0c36a; --warn-soft: #382b10; --warn-line: #6b5420;
  --bad: #ff8f86; --bad-soft: #3d1a17; --ok: #48c18c; --ok-soft: #17382a;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.4;
  padding-inline: 16px; padding-block: 0 112px; margin: 0 auto; max-width: 640px;
  -webkit-tap-highlight-color: transparent;
}
h1, h2, h3, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
small { font-size: 13px; color: var(--muted); }
b { font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.pad { padding: 14px 4px; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-block: 14px 6px; }
.brand { font-family: var(--f-num); font-weight: 700; font-size: 22px; letter-spacing: .02em; text-transform: uppercase; }
.brand span { color: var(--accent); }
.status { font-size: 13px; color: var(--muted); min-height: 1em; }
.status.bad { color: var(--bad); }

.hero { display: flex; flex-direction: column; gap: 12px; padding-block: 10px 6px; }
.hero h1 { font-family: var(--f-num); font-size: 34px; line-height: 1.05; font-weight: 700; text-wrap: balance; }
.hero .sub { color: var(--muted); font-size: 16px; }
.sec { font-family: var(--f-num); font-size: 22px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; margin-block: 22px 10px; }
.sec.in { margin-block: 0 8px; }

/* Boutons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; padding: 12px 18px;
  border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
  font-weight: 600; font-size: 17px; cursor: pointer; text-align: center; box-shadow: var(--shadow); user-select: none;
}
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.big { min-height: 64px; font-size: 19px; width: 100%; }
.btn.big svg { width: 26px; height: 26px; flex: none; }
.btn.small { min-height: 44px; padding: 8px 14px; font-size: 15px; }
.btn.ghost { background: transparent; box-shadow: none; }
.btn.danger { border-color: var(--bad); color: var(--bad); background: transparent; box-shadow: none; }
.btn.ghostd { margin-top: 10px; width: 100%; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; text-decoration: underline; cursor: pointer; font-size: inherit; }
.row { display: flex; flex-wrap: wrap; }
.gap { gap: 10px; margin-block: 10px; }
.row.gap > .btn:not(.big) { flex: 1 1 auto; }

.seg { display: flex; background: var(--surface2); border: 1.5px solid var(--line); border-radius: 14px; padding: 3px; gap: 3px; }
.segb { flex: 1; min-height: 46px; border: 0; border-radius: 11px; background: transparent; font-weight: 600; cursor: pointer; font-size: 16px; }
.seg.small .segb { min-height: 40px; font-size: 14px; }
.segb.on { background: var(--accent); color: var(--accent-ink); }

/* Cartes */
.card { background: var(--surface); border: 1.5px solid var(--line); border-radius: 18px; padding: 16px; margin-block: 12px; box-shadow: var(--shadow); min-width: 0; }
.card.busy, .busy.inline { display: flex; align-items: center; gap: 14px; }
.busy.inline { padding-block: 6px; }
.card.alert.bad { background: var(--bad-soft); border-color: var(--bad); }
.card.alert.warn { background: var(--warn-soft); border-color: var(--warn-line); }
.card.shot summary { cursor: pointer; font-weight: 600; min-height: 32px; }
.card.shot img { display: block; width: 100%; max-height: 460px; object-fit: contain; border-radius: 12px; margin-top: 10px; background: var(--surface2); }
.note { padding: 10px 12px; border-radius: 12px; margin-block: 8px; background: var(--surface2); font-size: 15px; }
.note.warn { background: var(--warn-soft); color: var(--warn); border: 1px solid var(--warn-line); }
.note.bad { background: var(--bad-soft); color: var(--bad); border: 1px solid var(--bad); }
.note.ok { background: var(--ok-soft); color: var(--ok); border: 1px solid var(--ok); }
.note.small { font-size: 14px; padding: 8px 10px; }
.warn { color: var(--warn); }
.spin { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: sp 0.9s linear infinite; flex: none; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } }
.boot { display: flex; flex-direction: column; align-items: center; gap: 14px; padding-block: 80px; color: var(--muted); }

/* Puces */
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-block: 8px 2px; }
.chips.tiny { margin: 0; justify-content: flex-end; }
.chip { display: inline-flex; align-items: baseline; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: 14px; font-weight: 500; background: var(--surface2); border: 1px solid var(--line); white-space: nowrap; }
.chip b { font-family: var(--f-num); font-size: 18px; line-height: 1; font-variant-numeric: tabular-nums; }
.chip i { font-style: normal; font-size: 12px; opacity: .8; }
.chip.def { background: var(--def-soft); color: var(--def); border-color: transparent; }
.chip.atk { background: var(--atk-soft); color: var(--atk); border-color: transparent; }
.chip.miss { background: transparent; color: var(--warn); border: 1.5px dashed var(--warn-line); }
.chip.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.chip.warnc { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.tiny { padding: 1px 8px; font-size: 13px; }
.sum .chip b { font-size: 20px; }
.badge { padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap; align-self: flex-start; }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }

/* Équipe */
.members { display: flex; flex-direction: column; gap: 12px; }
.member { background: var(--surface); border: 1.5px solid var(--line); border-radius: 18px; padding: 14px; box-shadow: var(--shadow); min-width: 0; }
.member.unres { border-color: var(--warn-line); }
.mhead { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.mname { font-size: 20px; font-weight: 600; overflow-wrap: anywhere; }
.msub { color: var(--muted); font-size: 14px; }
.cands { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
.cands .lbl { font-size: 14px; color: var(--muted); }
.cand-btn { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; min-height: 52px; padding: 8px 12px; border: 1.5px solid var(--accent); background: var(--accent-soft); border-radius: 12px; cursor: pointer; text-align: left; }
.mactions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.check { display: flex; align-items: center; gap: 12px; min-height: 48px; margin-top: 6px; font-size: 16px; cursor: pointer; }
.check input { width: 26px; height: 26px; accent-color: var(--accent); flex: none; }

/* Formulaires */
.field { display: flex; flex-direction: column; gap: 5px; margin-block: 8px; min-width: 0; }
.field > span { font-size: 15px; font-weight: 600; }
.field small { font-size: 12.5px; }
input[type=text], input[type=search], select, textarea {
  width: 100%; min-height: 50px; padding: 10px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface2); font-size: 18px;
}
textarea { min-height: 110px; resize: vertical; }
.search { margin-block: 4px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 360px) { .grid2 { grid-template-columns: 1fr; } }
details.more { margin-block: 8px; }
details.more > summary { cursor: pointer; font-weight: 600; min-height: 36px; display: flex; align-items: center; }
details.card.more { padding-block: 10px; }

/* Résultats */
.stat .shead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 8px; }
.stat h3 { font-family: var(--f-num); font-size: 22px; text-transform: uppercase; letter-spacing: .03em; }
.stat.def h3 { color: var(--def); }
.stat.atk h3 { color: var(--atk); }
.big { font-family: var(--f-num); font-size: 44px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.big small { font-size: 20px; font-weight: 500; }
.stat.def .big:not(.warn) { color: var(--def); }
.stat.atk .big:not(.warn) { color: var(--atk); }
.big.warn { font-size: 28px; }
.rule { margin-bottom: 4px; }
.cl { display: flex; flex-direction: column; gap: 8px; }
details.cand { border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface2); }
details.cand > summary { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 52px; padding: 8px 14px; cursor: pointer; list-style: none; }
details.cand > summary::-webkit-details-marker { display: none; }
details.cand > summary::after { content: '▾'; color: var(--muted); margin-left: 4px; }
details.cand[open] > summary::after { content: '▴'; }
details.cand > summary > span:first-child { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.tot { font-family: var(--f-num); font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tot small { font-size: 13px; font-family: var(--f-body); font-weight: 500; }
details.cand > .note { margin-inline: 12px; }
.tw { overflow-x: auto; padding: 0 10px 10px; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 15px; }
th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 4px 6px; border-bottom: 1px solid var(--line); }
th:nth-child(n+2), td:nth-child(n+2) { text-align: right; }
td { padding: 7px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
td small { display: block; }
tr.principal td:first-child { font-weight: 600; }
tfoot td { font-weight: 500; }
tfoot tr.total td { font-weight: 700; font-size: 17px; border-top: 2px solid var(--ink); border-bottom: 0; }
tfoot tr.crit td { color: var(--muted); font-style: italic; border-bottom: 0; }

/* Importation */
.job .jh { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.job .jh b { overflow-wrap: anywhere; }
.job .jh small { display: block; }
.x { width: 40px; height: 40px; border-radius: 12px; border: 1.5px solid var(--line); background: transparent; font-size: 22px; line-height: 1; cursor: pointer; flex: none; }
.confirm { border-top: 1px solid var(--warn-line); padding-top: 8px; margin-top: 8px; }
.clabel { margin-bottom: 6px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.opts { display: flex; flex-direction: column; gap: 6px; }
.opt { min-height: 46px; padding: 8px 12px; border-radius: 12px; border: 1.5px solid var(--warn-line); background: var(--surface); text-align: left; cursor: pointer; color: var(--ink); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.opt.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.opt small { color: inherit; opacity: .8; }
.conf { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 8px; font-size: 15px; }
.rows, .hist, .plist { list-style: none; margin: 0; padding: 0; }
.rows li { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 15px; align-items: center; }
.rows li > span:first-child { overflow-wrap: anywhere; min-width: 0; }
.rows em { font-style: normal; font-size: 12px; color: var(--muted); margin-left: 6px; }
.rows .chips { flex-wrap: nowrap; align-items: center; }
.hist li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.hist li > div { min-width: 0; }
.hist b { overflow-wrap: anywhere; }
.hist small { display: block; }
.hist .hc { text-align: right; flex: none; max-width: 52%; }

/* Joueurs */
.prow { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; min-height: 56px; padding: 8px 4px; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; cursor: pointer; }
.pn { display: flex; flex-direction: column; min-width: 0; overflow-wrap: anywhere; }
.dupg { border: 1.5px solid var(--line); border-radius: 14px; padding: 10px; margin-block: 8px; display: flex; flex-direction: column; gap: 8px; }
.dp { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.dp small { display: block; }

/* Navigation et fenêtres */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center;
  background: color-mix(in srgb, var(--surface) 94%, transparent); border-top: 1.5px solid var(--line);
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.tabbar > div { display: flex; width: 100%; max-width: 640px; gap: 4px; }
.tabbar button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 58px; border: 0; background: transparent; border-radius: 14px; color: var(--muted); font-size: 12.5px; font-weight: 600; cursor: pointer; }
.tabbar svg { width: 26px; height: 26px; }
.tabbar button.on { color: var(--accent); background: var(--accent-soft); }
#modal { position: fixed; inset: 0; z-index: 40; }
.scrim { position: absolute; inset: 0; background: rgba(8, 14, 11, .55); }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; max-height: 88%; overflow-y: auto; margin-inline: auto; max-width: 640px;
  background: var(--surface); border-radius: 22px 22px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -8px 30px rgba(0, 0, 0, .25);
  display: flex; flex-direction: column; gap: 8px;
}
.sheet h2 { font-family: var(--f-num); font-size: 26px; font-weight: 700; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); z-index: 50; background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 600; font-size: 15px; max-width: 90%; }
[hidden] { display: none !important; }

.stat .shead { flex-wrap: wrap; }
.big { white-space: nowrap; }
td:first-child { width: 58%; }

</style></head><body>

<script>
/* Sorare Snatch Calculator — moteur (données, fusion, lecture de tableaux, calculs).
   Aucune dépendance. Utilisable dans le navigateur (window.Core) et dans Node (tests). */
(function (root) {
  'use strict';

  var STATS = ['def', 'atk'];
  var DEFAULT_RULES = { mainPct: 100, supportPct: 25, rounding: 'ceil' };
  var FUZZY_MIN = 0.85;

  /* ---------- Noms ---------- */

  var SPECIAL = { 'ø': 'o', 'ł': 'l', 'đ': 'd', 'æ': 'ae', 'œ': 'oe', 'ß': 'ss', 'ð': 'd', 'þ': 'th', 'ı': 'i' };

  function normText(s) {
    if (s == null) return '';
    s = String(s).toLowerCase();
    s = s.replace(/[øłđæœßðþı]/g, function (c) { return SPECIAL[c]; });
    s = s.normalize('NFD').replace(/[̀-ͯ]/g, '');
    s = s.replace(/[’'`´]/g, '');
    s = s.replace(/[^\p{L}\p{N}]+/gu, ' ');
    return s.trim();
  }

  function tokens(name) {
    var t = normText(name);
    return t ? t.split(' ') : [];
  }

  /* Clé de comparaison : mots triés, donc « Dupont Paul » = « Paul Dupont ». */
  function nameKey(name) {
    return tokens(name).sort().join(' ');
  }

  function lev(a, b) {
    if (a === b) return 0;
    var m = a.length, n = b.length;
    if (!m) return n;
    if (!n) return m;
    var prev = new Array(n + 1), cur = new Array(n + 1), i, j;
    for (j = 0; j <= n; j++) prev[j] = j;
    for (i = 1; i <= m; i++) {
      cur[0] = i;
      for (j = 1; j <= n; j++) {
        var cost = a.charCodeAt(i - 1) === b.charCodeAt(j - 1) ? 0 : 1;
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost);
      }
      var t = prev; prev = cur; cur = t;
    }
    return prev[n];
  }

  function sim(a, b) {
    var L = Math.max(a.length, b.length);
    return L ? 1 - lev(a, b) / L : 1;
  }

  /* ---------- Nombres ---------- */

  function parseNum(v) {
    if (v == null) return null;
    if (typeof v === 'number') return isFinite(v) ? v : null;
    var s = String(v).trim().replace(/ /g, ' ');
    if (!s) return null;
    var m = s.match(/-?\d+(?:[.,]\d+)?/);
    if (!m) return null;
    var n = parseFloat(m[0].replace(',', '.'));
    return isFinite(n) ? n : null;
  }

  /* ---------- Index et correspondance ---------- */

  function buildIndex(players) {
    var byKey = {}, keyOf = {}, list = [];
    Object.keys(players).forEach(function (id) {
      var k = nameKey(players[id].name);
      keyOf[id] = k;
      (byKey[k] = byKey[k] || []).push(id);
      list.push(id);
    });
    return { byKey: byKey, keyOf: keyOf, list: list };
  }

  function indexAdd(idx, p) {
    var k = nameKey(p.name);
    idx.keyOf[p.id] = k;
    (idx.byKey[k] = idx.byKey[k] || []).push(p.id);
    idx.list.push(p.id);
  }

  function indexRemoveKey(idx, id, key) {
    var a = idx.byKey[key];
    if (a) {
      var i = a.indexOf(id);
      if (i >= 0) a.splice(i, 1);
      if (!a.length) delete idx.byKey[key];
    }
  }

  function sameClub(a, b) {
    var x = normText(a), y = normText(b);
    return !!x && !!y && x === y;
  }

  /* Cherche les joueurs correspondant à un nom.
     Retourne { status: 'exact'|'confirm'|'new', id, candidates:[{id,score,why}] } */
  function findMatch(players, idx, name, club, forceConfirm) {
    var key = nameKey(name);
    if (!key) return { status: 'new', candidates: [] };
    var exact = idx.byKey[key] || [];
    var cands = [];

    if (exact.length === 1 && !forceConfirm) {
      return { status: 'exact', id: exact[0], candidates: [] };
    }
    if (exact.length > 1 && !forceConfirm) {
      var byClub = exact.filter(function (id) { return sameClub(players[id].club, club); });
      if (byClub.length === 1) return { status: 'exact', id: byClub[0], candidates: [] };
      exact.forEach(function (id) { cands.push({ id: id, score: 1, why: 'même nom' }); });
      return { status: 'confirm', candidates: cands };
    }
    exact.forEach(function (id) { cands.push({ id: id, score: 1, why: 'même nom' }); });

    var tk = tokens(name);
    var seen = {};
    exact.forEach(function (id) { seen[id] = 1; });
    var hasInitial = tk.some(function (t) { return t.length === 1; });

    idx.list.forEach(function (id) {
      if (seen[id]) return;
      var pk = idx.keyOf[id];
      if (!pk) return;
      var score = sim(key, pk), why = 'nom proche';
      var pt = pk.split(' ');
      // « P. Dupont » ↔ « Paul Dupont »
      if (hasInitial) {
        var rest = tk.filter(function (t) { return t.length > 1; });
        var inits = tk.filter(function (t) { return t.length === 1; });
        var okRest = rest.length && rest.every(function (t) { return pt.indexOf(t) >= 0; });
        var okInit = inits.every(function (c) {
          return pt.some(function (t) { return t.length > 1 && t.charAt(0) === c && rest.indexOf(t) < 0; });
        });
        if (okRest && okInit && score < 0.9) { score = 0.9; why = 'initiale'; }
      }
      // « Vinicius » ↔ « Vinicius Junior »
      if (score < FUZZY_MIN && tk.length && pt.length && tk.length !== pt.length) {
        var small = tk.length < pt.length ? tk : pt, big = tk.length < pt.length ? pt : tk;
        var inc = small.every(function (t) { return big.indexOf(t) >= 0; });
        var longTok = small.some(function (t) { return t.length >= 4; });
        if (inc && longTok) { score = Math.max(score, 0.8); why = 'nom partiel'; }
      }
      if (score >= FUZZY_MIN || (why !== 'nom proche' && score >= 0.8)) {
        cands.push({ id: id, score: score, why: why });
      }
    });

    cands.sort(function (a, b) { return b.score - a.score; });
    cands = cands.slice(0, 4);
    if (!cands.length) return { status: 'new', candidates: [] };
    return { status: 'confirm', candidates: cands };
  }

  /* ---------- Fusion / import ---------- */

  function randomId(chunks) {
    var c = Math.floor(Math.random() * (chunks || 48));
    var s = '';
    var chars = 'abcdefghjkmnpqrstuvwxyz23456789';
    for (var i = 0; i < 7; i++) s += chars.charAt(Math.floor(Math.random() * chars.length));
    return (c < 10 ? '0' : '') + c + '-' + s;
  }

  function clonePlayer(p) {
    return JSON.parse(JSON.stringify(p));
  }

  /* rows : [{name, def, atk, pos, club, unreadable}]
     decisions : { [rowIndex]: 'new' | 'skip' | playerId }
     keepOld   : { 'rowIndex:stat': true }
     meta      : { file, date }

  function applyImport(players, rows, decisions, keepOld, meta) {
    decisions = decisions || {};
    keepOld = keepOld || {};
    meta = meta || {};
    var date = meta.date || new Date().toISOString();
    var file = meta.file || '';
    var work = {};      // copies modifiées
    var get = function (id) { return work[id] || players[id]; };
    var view = {};      // vue combinée pour l'index
    Object.keys(players).forEach(function (id) { view[id] = players[id]; });
    var idx = buildIndex(view);
    var report = { items: [], created: 0, completed: 0, updated: 0, unchanged: 0, skipped: 0, toconfirm: 0, conflicts: [] };

    rows.forEach(function (row, i) {
      var item = { i: i, row: row, status: null, result: null, id: null, candidates: [], changes: [] };
      report.items.push(item);
      if (!row.name || !nameKey(row.name)) { item.result = 'skipped'; report.skipped++; return; }

      var m = findMatch(view, idx, row.name, row.club, !!row.unreadable);
      item.status = m.status;
      item.candidates = m.candidates;
      var target = null;

      if (m.status === 'exact') {
        target = m.id;
      } else if (m.status === 'new') {
        target = 'new';
      } else {
        var d = decisions[i];
        if (d === 'new') target = 'new';
        else if (d === 'skip') { item.result = 'skipped'; report.skipped++; return; }
        else if (d && view[d]) target = d;
        else { item.result = 'toconfirm'; report.toconfirm++; return; }
      }

      var p, isNew = false;
      if (target === 'new') {
        isNew = true;
        p = { id: randomId(meta.chunks), name: String(row.name).trim().replace(/\s+/g, ' '), pos: row.pos || null,
          club: row.club || null, def: null, atk: null, src: {}, hist: [], created: date };
        work[p.id] = p;
        view[p.id] = p;
        indexAdd(idx, p);
      } else {
        if (!work[target]) work[target] = clonePlayer(players[target]);
        p = work[target];
        view[target] = p;
        if (!p.src) p.src = {};
        if (!p.hist) p.hist = [];
      }
      item.id = p.id;
      item.name = p.name;

      var filled = 0, changed = 0, same = 0;
      STATS.forEach(function (s) {
        var v = row[s];
        if (v == null) return;
        if (p[s] == null) {
          p[s] = v; p.src[s] = file; filled++;
          item.changes.push({ stat: s, old: null, now: v, kind: 'new' });
        } else if (p[s] === v) {
          same++;
        } else if (keepOld[i + ':' + s]) {
          item.changes.push({ stat: s, old: p[s], now: p[s], offered: v, kind: 'kept' });
          report.conflicts.push({ i: i, name: p.name, stat: s, old: p[s], now: v, kept: true });
        } else {
          p.hist.push({ stat: s, old: p[s], now: v, date: date, src: file });
          if (p.hist.length > 12) p.hist = p.hist.slice(-12);
          item.changes.push({ stat: s, old: p[s], now: v, kind: 'changed' });
          report.conflicts.push({ i: i, name: p.name, stat: s, old: p[s], now: v, kept: false });
          p[s] = v; p.src[s] = file; changed++;
        }
      });
      if (!p.pos && row.pos) p.pos = row.pos;
      if (!p.club && row.club) p.club = row.club;
      p.updated = date;

      if (isNew) { item.result = 'created'; report.created++; }
      else if (changed) { item.result = 'updated'; report.updated++; }
      else if (filled) { item.result = 'completed'; report.completed++; }
      else { item.result = 'unchanged'; report.unchanged++; }

    report.players = work;
    return report;
  }

  /* ---------- Lecture de tableaux ---------- */

  function classifyHeader(cell) {
    var t = normText(cell);
    if (!t) return null;
    var tk = t.split(' ');
    var has = function (re) { return tk.some(function (x) { return re.test(x); }); };
    if (/^(prenom|first name|firstname|given name)$/.test(t) || t === 'first') return 'first';
    if (/^(nom de famille|last name|lastname|surname|family name)$/.test(t) || t === 'last') return 'last';
    if (/^(nom|nom du joueur|nom joueur|joueur|player|player name|name|footballeur|card|carte|nom complet|full name|joueurs|players)$/.test(t)) return 'name';
    var d = has(/^(def|dfn|dfs|defense|defence|defending|defensif|defensive)$/);
    var a = has(/^(atk|att|attack|attaque|attacking|offense|offensif|offensive|off)$/);
    if (d && !a) return 'def';
    if (a && !d) return 'atk';
    if (d && a) return null;
    if (/^(pos|position|poste|role)$/.test(t)) return 'pos';
    if (/^(club|equipe|team|squad)$/.test(t)) return 'club';
    if (/^(rang|rank|classement|place|n|no|num|numero)$/.test(t) || String(cell).trim() === '#') return 'rank';
    if (/^(score|valeur|value|stat|stats|statistique|points|pts|total|moyenne|avg|average|rating|note|niveau|level|power|puissance)$/.test(t)) return 'value';
    return null;
  }

  var JUNK_NAMES = /^(total|moyenne|average|rang|rank|joueur|player|nom|name|classement|top \d+)$/;

  function normPos(s) {
    if (s == null) return null;
    var t = normText(s);
    if (!t) return null;
    if (/^(gk|gardien|goalkeeper|goal|g)$/.test(t)) return 'GK';
    if (/^(def|df|defenseur|defender|d|defenseurs)$/.test(t)) return 'DEF';
    if (/^(mid|mf|milieu|midfielder|m|milieux)$/.test(t)) return 'MID';
    if (/^(att|atk|fwd|fw|st|attaquant|forward|striker|a|attaquants)$/.test(t)) return 'FWD';
    var raw = String(s).trim();
    return raw.length <= 12 ? raw.toUpperCase() : null;
  }

  function cellStr(c) { return c == null ? '' : String(c).trim(); }

  function looksLikeName(s) {
    s = cellStr(s);
    if (!s || s.length < 2) return false;
    if (!/\p{L}{2,}/u.test(s)) return false;
    if (/^\d+([.,]\d+)?$/.test(s)) return false;
    return true;
  }

  /* rows : tableau de tableaux. hint : 'def' | 'atk' | null (étiquette d'une colonne sans titre). */
  function parseTable(rows, hint) {
    var out = { rows: [], notes: [], headerFound: false };
    var hdrIdx = -1, cols = null, r, c;

    for (r = 0; r < Math.min(rows.length, 30); r++) {
      var cl = (rows[r] || []).map(classifyHeader);
      var hasName = cl.indexOf('name') >= 0 || (cl.indexOf('first') >= 0 && cl.indexOf('last') >= 0) || cl.indexOf('last') >= 0;
      var hasVal = cl.indexOf('def') >= 0 || cl.indexOf('atk') >= 0 || cl.indexOf('value') >= 0;
      if (hasName && hasVal) { hdrIdx = r; cols = cl; break; }
    }

    var map = {}; // type -> index
    if (hdrIdx >= 0) {
      out.headerFound = true;
      cols.forEach(function (t, i) { if (t && map[t] == null) map[t] = i; });
    } else {
      // Sans titres : on devine les colonnes.
      var width = 0;
      rows.forEach(function (row) { if (row && row.length > width) width = row.length; });
      var info = [];
      for (c = 0; c < width; c++) {
        var txt = 0, num = 0, ints = [];
        rows.forEach(function (row) {
          var v = row ? row[c] : null;
          if (cellStr(v) === '') return;
          if (parseNum(v) != null && /^[\s\d.,+-]+$/.test(cellStr(v))) { num++; ints.push(parseNum(v)); }
          else if (looksLikeName(v)) txt++;

        info.push({ c: c, txt: txt, num: num, ints: ints });
      }
      var nameCol = info.slice().sort(function (a, b) { return b.txt - a.txt; })[0];
      if (!nameCol || nameCol.txt < 1) { out.notes.push('Aucune colonne de noms de joueurs détectée.'); return out; }
      map.name = nameCol.c;
      var numCols = info.filter(function (x) { return x.num >= Math.max(1, nameCol.txt * 0.5) && x.c !== nameCol.c; });
      // colonne de rang : entiers croissants 1..n
      numCols = numCols.filter(function (x) {
        var asc = x.ints.length > 2 && x.ints.every(function (v, i) { return v === i + 1 || (i > 0 && v === x.ints[i - 1] + 1); });
        if (asc && x.c < nameCol.c) { map.rank = x.c; return false; }
        return true;
      });
      if (numCols.length === 1) map.value = numCols[0].c;
      else if (numCols.length >= 2) {
        map.value = numCols[0].c;
        out.notes.push('Plusieurs colonnes de chiffres sans titre : seule la première est utilisée.');
      }
      hdrIdx = -1;
    }

    var start = hdrIdx + 1;
    var valueHint = hint || null;
    for (r = start; r < rows.length; r++) {
      var row = rows[r] || [];
      var name;
      if (map.first != null && (map.last != null || map.name != null)) {
        name = (cellStr(row[map.first]) + ' ' + cellStr(row[map.last != null ? map.last : map.name])).trim();
      } else if (map.name != null) name = cellStr(row[map.name]);
      else name = cellStr(row[map.last]);
      name = name.replace(/^#?\d{1,4}\s*[.)\-:]\s*/, '');
      if (!name) continue;
      if (!looksLikeName(name)) continue;
      if (JUNK_NAMES.test(normText(name))) continue;
      var rec = { name: name.replace(/\s+/g, ' '), def: null, atk: null, pos: null, club: null };
      if (map.def != null) rec.def = parseNum(row[map.def]);
      if (map.atk != null) rec.atk = parseNum(row[map.atk]);
      if (map.value != null && map.def == null && map.atk == null) {
        var v = parseNum(row[map.value]);
        if (v != null) { if (valueHint) rec[valueHint] = v; else rec.unk = v; }
      }
      if (map.pos != null) rec.pos = normPos(row[map.pos]);
      if (map.club != null) rec.club = cellStr(row[map.club]) || null;

  /* Indice DEF/ATK d'après le nom du fichier ou de la feuille. */
  function detectHint(label) {

    var d = /(^| )(def|dfn|defens\w*|defend\w*|defenseur\w*|defenceman)( |$)/.test(t) || /defens|defend/.test(t);
    var a = /(^| )(atk|att|attaq\w*|attack\w*|offens\w*|striker\w*|forward\w*|fwd)( |$)/.test(t) || /attaq|attack|offens/.test(t);

  function resolveUnknown(rows, stat) {

    return rows;
  }


  /* ---------- CSV ---------- */

  function parseCSV(text) {
    text = String(text || '').replace(/^﻿/, '');
    var first = text.split(/\r?\n/).slice(0, 8).join('\n');
    var best = ',', bestN = -1;
    [';', ',', '\t', '|'].forEach(function (d) {
      var n = first.split(d).length - 1;
      if (n > bestN) { bestN = n; best = d; }
    });
    var rows = [], row = [], cur = '', q = false, i, ch;
    for (i = 0; i < text.length; i++) {
      ch = text.charAt(i);
      if (q) {
        if (ch === '"') { if (text.charAt(i + 1) === '"') { cur += '"'; i++; } else q = false; }
        else cur += ch;
      } else if (ch === '"') q = true;
      else if (ch === best) { row.push(cur); cur = ''; }
      else if (ch === '\n' || ch === '\r') {
        if (ch === '\r' && text.charAt(i + 1) === '\n') i++;
        row.push(cur); cur = '';
        if (row.some(function (x) { return x !== ''; })) rows.push(row);
        row = [];
      } else cur += ch;
    }
    row.push(cur);
    if (row.some(function (x) { return x !== ''; })) rows.push(row);
    return rows;
  }


  /* ---------- Exports PDF « Snatch Watch » ---------- */

  /* Reconstruit des lignes de texte à partir des morceaux de texte d'une page PDF (pdf.js). */
  function pdfItemsToText(items) {
    var rows = [];
    items.forEach(function (it) {
      if (!it.str || !it.str.trim()) return;
      var x = it.transform[4], y = it.transform[5];
      var row = rows.filter(function (r) { return Math.abs(r.y - y) < 2.5; })[0];
      if (!row) { row = { y: y, items: [] }; rows.push(row); }
      row.items.push({ x: x, str: it.str, w: it.width || 0 });
    });
    rows.sort(function (a, b) { return b.y - a.y; });
    return rows.map(function (r) {
      r.items.sort(function (a, b) { return a.x - b.x; });
      var s = '', end = null;
      r.items.forEach(function (i) {
        if (end != null) { var gap = i.x - end; s += gap > 8 ? '\t' : (gap > 1 ? ' ' : ''); }
        s += i.str; end = i.x + i.w;
      });
      return s;
    }).join('\n');
  }

  var SW_POS = /^(GOALKEEPER|DEFENDER|MIDFIELDER|FORWARD)\s*[·•|]\s*(.+)$/i;
  var SW_RANK = /^(\d{1,3})\s+(\S.*?)\s+(\d{1,3}(?:[.,]\d+)?)$/;
  var SW_LIST = /^(\d{1,3}(?:[.,]\d+)?)\s+(\d{1,3}(?:[.,]\d+)?)\s+IR\b/;

  function prettyClub(slug) {
    var parts = String(slug || '').trim().toLowerCase().split('-').filter(Boolean);
    if (parts.length % 2 === 0 && parts.length > 0) {
      var h = parts.length / 2;
      if (parts.slice(0, h).join('-') === parts.slice(h).join('-')) parts = parts.slice(0, h);
    }
    return parts.map(function (p) { return p.charAt(0).toUpperCase() + p.slice(1); }).join(' ') || null;
  }

  /* Nettoie les éléments d'interface qui se mélangent au texte : bandeau « Snatch Watch · Updated 2d ago »,

  function swCleanLines(text) {
    var out = [];
    String(text || '').split(/\r?\n/).forEach(function (raw) {
      var l = raw.replace(/ /g, ' ').trim();
      if (!l) return;
      l = l.replace(/\s*\bUpdated\s+\S+(?:\s+\S+)?\s+ago\b.*$/i, '').trim();
      if (!l || l === ':' || /^Legendary\b.*\bHistory$/i.test(l) || /^Sort by IR\b/i.test(l) || /^\d+\s+players$/i.test(l)) return;
      var flags = { snatch: false, watch: false };
      var m;
      if ((m = /^Snatch\s*Watch\b\s*(.*)$/i.exec(l))) { l = m[1].trim(); flags.snatch = flags.watch = true; }
      else if ((m = /^Snatch(?=\p{Lu})(.*)$/u.exec(l))) { l = m[1].trim(); flags.snatch = true; }
      else if ((m = /^Watch(?=\p{Lu})(.*)$/u.exec(l)) || (m = /^Watch\s+(\S.*)$/.exec(l))) { l = m[1].trim(); flags.watch = true; }
      else if (/^(Snatch|Watch)$/i.test(l)) return;
      if (!l) return;
      out.push({ t: l, snatch: flags.snatch, watch: flags.watch });
    });
    // Cas où le bandeau recouvre le nom en le coupant en deux lignes (« SnatchNicolas » / « WatchPépé »)
    var merged = [];
    for (var i = 0; i < out.length; i++) {
      var cur = out[i], nxt = out[i + 1];
      if (cur.snatch && !cur.watch && nxt && nxt.watch && !SW_POS.test(cur.t) && !SW_POS.test(nxt.t) && !SW_RANK.test(cur.t)) {
        merged.push(cur.t + ' ' + nxt.t); i++;
      } else merged.push(cur.t);
    }
    return merged;
  }

  function parseSnatchWatch(text) {
    var lines = swCleanLines(text);
    if (!lines.some(function (l) { return SW_POS.test(l); })) return null;
    var stat = null, declared = null, title = null, m, i;
    for (i = 0; i < Math.min(lines.length, 12); i++) {
      if ((m = /^Top\s+(\d+)\s+.*?\bby\s+(defending|attacking)\s*score\b/i.exec(lines[i]))) {
        declared = parseInt(m[1], 10); stat = /^def/i.test(m[2]) ? 'def' : 'atk'; title = lines[i]; break;
      }
    }

      if (!pos) continue;
      var prev = lines[i - 1] || '', next = lines[i + 1] || '';
      var rec = { name: null, def: null, atk: null, pos: normPos(pos[1]), club: prettyClub(pos[2]) };
      var rk = SW_RANK.exec(prev), ls = SW_LIST.exec(next);
      if (rk && !ls) {

        var v = parseNum(rk[3]);
        if (stat) rec[stat] = v; else rec.unk = v;
      } else if (ls && !rk) {
        rec.name = prev.trim();
        rec.atk = parseNum(ls[1]); rec.def = parseNum(ls[2]); // 1er nombre = ATK, 2e = DEF (vérifié par recoupement avec les classements)
      } else {

      warnings.push('Le PDF annonce ' + declared + ' joueurs, mais ' + rows.length + ' ont été lus' + (skipped.length ? ' (non lus : ' + skipped.slice(0, 5).join(', ') + ')' : '') + '. Vérifiez avant d\'enregistrer.');
    } else if (skipped.length) {

  function readText(file) {
    return file.arrayBuffer().then(function (buf) {
      var t = new TextDecoder('utf-8').decode(buf);
      if (t.indexOf(String.fromCharCode(65533)) >= 0) { try { t = new TextDecoder('windows-1252').decode(buf); } catch (e) { /* garde utf-8 */ } }
      return t;
    });
  }

  function loadBitmap(blob) {
    if (window.createImageBitmap) {
      return createImageBitmap(blob, { imageOrientation: 'from-image' }).catch(function () { return viaImg(blob); });
    }
    return viaImg(blob);
  }
  function viaImg(blob) {
    return new Promise(function (res, rej) {
      var u = URL.createObjectURL(blob), im = new Image();
      im.onload = function () { res(im); };
      im.onerror = function () { rej(new Error('Image illisible')); };
      im.src = u;
    });
  }
  function canvasBlob(cv) {
    return new Promise(function (res) { cv.toBlob(function (b) { res(b); }, 'image/jpeg', 0.92); });
  }
  /* Coupe une image très haute en tranches qui se chevauchent, pour garder les petits caractères lisibles. */
  function sliceImage(file, maxRatio) {
    return loadBitmap(file).then(function (bmp) {
      var w = bmp.width, h = bmp.height;
      if (h / w <= maxRatio) return [file];
      var segH = Math.round(w * maxRatio * 0.9), step = Math.round(segH * 0.88);
      var out = [], y = 0, chain = Promise.resolve();
      var spans = [];
      while (true) {
        if (y + segH >= h) { spans.push([Math.max(0, h - segH), h]); break; }
        spans.push([y, y + segH]); y += step;
      }
      spans.forEach(function (sp) {
        chain = chain.then(function () {
          var cv = document.createElement('canvas');
          cv.width = w; cv.height = sp[1] - sp[0];
          cv.getContext('2d').drawImage(bmp, 0, sp[0], w, cv.height, 0, 0, w, cv.height);
          return canvasBlob(cv).then(function (b) { out.push(b); });
        });
      });
      return chain.then(function () { return out; });
    });
  }

  function readPdf(file, job, mode, hint) {
    var base = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
    return (window.pdfjsLib ? Promise.resolve() : loadScript(base + 'pdf.min.js')).then(function () {

        (function (pn) {

        })(n);
      }

          parsed.notes.forEach(function (n) { job.notes.push(n); });
          (parsed.warnings || []).forEach(function (w) { job.warnings.push(w); });

  function readJob(job, file) {

      if (!rr.length) throw { code: 'x', message: 'Aucun nom lisible sur cette capture. Vérifiez que votre base contient des joueurs (onglet Importer), ou ajoutez-les à la main.' };
      S.team.members = C.matchTeam(S.db.players, rr);
      S.team.members.forEach(function (m, i) { if (S.team.srcs && S.team.srcs[i]) m.posSrc = S.team.srcs[i]; });
      var skUnsure = 0;
      S.team.members.forEach(function (m, i) {
        var sk = (S.team.sks && S.team.sks[i]) || [];
        m.skillsRead = sk;
        m.skills = {};
        sk.forEach(function (x) { if (C.SKILLS.some(function (k) { return k.key === x.key; })) m.skills[x.key] = (m.skills[x.key] || 0) + x.count; if (!x.sure) skUnsure++; });
      });
      if (skUnsure) notes.push('Le chiffre (x2, x3…) de ' + plural(skUnsure, 'compétence', 'compétences') + ' n\'a pas pu être lu : x1 appliqué, vérifiez-le sur la carte.');
      // étiquette illisible et équipe de 7 : l'ordre des cartes est gardien, 2 défenseurs, 2 milieux, 2 attaquants
      if (S.team.members.length === 7) {
        var inferred = 0;
        S.team.members.forEach(function (m, i) {
          var p = m.id ? S.db.players[m.id] : null;
          if (!(p && p.pos) && !m.pos) { m.pos = SLOT_ORDER[i]; m.posSrc = 'ordre'; inferred++; }
        });
        if (inferred) notes.push('Poste non lu sur ' + plural(inferred, 'carte', 'cartes') + ' : déduit de l\'ordre habituel (gardien, 2 défenseurs, 2 milieux, 2 attaquants). Vérifiez-le.');
      }
      S.team.state = 'done'; S.team.notes = notes;
      if (!Object.keys(S.db.players).length) S.team.err = 'Votre base est vide : importez d\'abord vos fichiers pour que les noms soient reconnus.';
    }).catch(function (e) {
      if (e && e.code === 'cancelled') { S.team.state = 'idle'; S.team.err = 'Lecture arrêtée.'; }
      else { S.team.state = 'error'; S.team.err = e && e.code && e.code !== 'x' ? aiErrorText(e) : (e && e.message) || 'Lecture impossible.'; }
    }).then(function () { S.team.ctl = null; S.team.progress = ''; renderTab(); });
  }

  function ocrImageToText(file, job) {
    return sliceImage(file, 1.7).then(function (blobs) {
      var out = [], seq = Promise.resolve();
      blobs.forEach(function (b, i) {
        seq = seq.then(function () {
          job.progress = 'Lecture de l\'image' + (blobs.length > 1 ? ' (partie ' + (i + 1) + '/' + blobs.length + ')' : '') + '…'; renderTab();
          return bitmapCanvas(b, 2400).then(ocrText).then(function (t) { out.push(t); });
        });
      });
      return seq.then(function () { job.progress = ''; return out.join('\n'); });
    });
  }

  function analyseScreenshot(file, refresh) {
    if (LOCAL) { return analyseScreenshotLocal(file); }
    if (!imagesOK()) {
      S.team = { state: 'error', members: [], err: noImagesMsg() + ' Vous pouvez aussi ajouter les joueurs à la main avec « Ajouter un joueur ».', img: null, ctl: null };
      renderTab(); return;
    }
    var ctl = new AbortController();
    if (S.team.img && S.team.img.url) { try { URL.revokeObjectURL(S.team.img.url); } catch (e) { /* ignore */ } }
    S.team = { state: 'reading', members: [], err: '', img: { url: URL.createObjectURL(file), name: file.name, file: file }, ctl: ctl };
    S.mainsOff = {};
    renderTab();
    sliceImage(file, 1.55).then(function (blobs) {
      var max = S.limits.images.maxCount || 4;
      if (blobs.length > max) blobs = blobs.slice(0, max);
      return S.sample.json(TEAM_PROMPT(blobs.length), { images: blobs, signal: ctl.signal, cache: refresh ? false : true });
    }).then(function (r) {
      var rows = C.normalizeAiRows(pickArray(r), null);
      if (!rows.length) throw { code: 'x', message: 'Aucun joueur détecté sur cette capture. Essayez une capture plus nette, ou ajoutez les joueurs à la main.' };
      S.team.members = C.matchTeam(S.db.players, rows);
      S.team.state = 'done';
    }).catch(function (e) {
      if (e && e.code === 'cancelled') { S.team.state = 'idle'; S.team.err = 'Lecture arrêtée.'; }
      else { S.team.state = 'error'; S.team.err = e && e.code && e.code !== 'x' ? aiErrorText(e) : (e && e.message) || 'Lecture impossible.'; }
    }).then(function () { S.team.ctl = null; renderTab(); });
  }

  function effStats(m) {
    var p = m.id ? S.db.players[m.id] : null;
    var out = { src: {} };
    STATS.forEach(function (s) {
      var dbv = p && p[s] != null ? p[s] : null, seen = m.seen && m.seen[s] != null ? m.seen[s] : null;
      var v = null, src = null;
      if (m.useSeen && m.useSeen[s] && seen != null) { v = seen; src = 'capture'; }
      else if (dbv != null) { v = dbv; src = 'base'; }
      else if (seen != null) { v = seen; src = 'capture'; }
      if (v == null && S.db.floors && S.db.floors[s]) { v = S.db.floors[s].value - 1; src = 'estimé'; }
      out[s] = v; out.src[s] = src;
      if (dbv != null && seen != null && dbv !== seen) { out.src[s + 'Diff'] = { db: dbv, seen: seen }; }
    });
    return out;
  }

  function teamCalc() {
    var members = S.team.members.map(function (m) {
      var e = effStats(m), p = m.id ? S.db.players[m.id] : null;
      return { skills: m.skills || null, name: p ? p.name : m.name, pos: (p && p.pos) || m.pos || null, def: e.def, atk: e.atk, defEst: e.src.def === 'estimé', atkEst: e.src.atk === 'estimé' };
    });
    var mains = [];
    S.team.members.forEach(function (m, i) { if (!S.mainsOff[m.key]) mains.push(i); });
    if (!members.length) return null;
    var b = S.bonus;
    return {
      mains: mains,
      calc: mains.length ? C.calcTeam(members, {
        rules: S.db.rules, mains: mains, roles: true,
        bonus: { def: numOrNull(b.def), atk: numOrNull(b.atk) },
        club: { def: numOrNull(b.clubDef), atk: numOrNull(b.clubAtk) },
        crit: { def: numOrNull(b.critDef), atk: numOrNull(b.critAtk) }
      }) : null
    };
  }

  /* ---------- Rendu : éléments communs ---------- */
  function chip(stat, v, src) {
    if (v == null) return '<span class="chip miss" title="Statistique inconnue">' + STAT_LABEL[stat] + ' manquante</span>';
    return '<span class="chip ' + stat + '">' + STAT_LABEL[stat] + ' <b>' + fmt(v) + '</b>' + (src === 'capture' ? ' <i>capture</i>' : src === 'estimé' ? ' <i>estimé</i>' : '') + '</span>';
  }
  function playerChips(p) {
    return STATS.map(function (s) { return chip(s, p[s] == null ? null : p[s]); }).join('');

  var TABS = [['analyse', 'Analyser'], ['import', 'Importer'], ['players', 'Joueurs'], ['settings', 'Réglages']];

  /* ---------- Rendu : Analyser ---------- */
  function renderAnalyse() {
    var t = S.team, h = '';
    h += '<section class="hero"><h1>Équipe adverse</h1>';
    h += '<p class="sub">Envoyez la capture d\'écran : les joueurs sont reconnus et leurs statistiques sont cherchées dans votre base (' + plural(Object.keys(S.db.players).length, 'joueur', 'joueurs') + ').</p>';

  function renderMember(m) {

      : (m.status === 'exact' ? badge('ok', 'Reconnu') : badge('ok', 'Confirmé'));

    if (pos) sub.push(esc(pos) + (!(p && p.pos) && m.posSrc ? (m.posSrc === 'carte' ? ' (lu sur la carte)' : ' (déduit de l\'ordre)') : '')); if (club) sub.push(esc(club));

          '<button class="link" data-act="toggle-seen" data-key="' + m.key + '" data-stat="' + s + '">' + (useSeen ? 'Utiliser la base (' + fmt(d.db) + ')' : 'Utiliser la capture (' + fmt(d.seen) + ')') + '</button></p>';

      });

    h += '<button class="btn small ghost" data-act="remove-member" data-key="' + m.key + '">Retirer</button>';
    h += '</div>';
    if (m.skillsRead && m.skillsRead.length) {
      h += '<p class="note small">Compétences lues sur la carte : ' + m.skillsRead.map(function (x) {
        var kk = C.SKILLS.filter(function (k) { return k.key === x.key; })[0];
        return esc(kk ? kk.name : (SK_NAME[x.key] || x.key)) + (x.count > 1 ? ' x' + x.count : '') + (kk ? '' : ' (sans effet DEF/ATK)') + (x.sure ? '' : ' (chiffre à vérifier)');
      }).join(', ') + '.</p>';

    }).join('') + '</div>';
