<style>
/* Terrain : fond craie à reflet vert, vert pelouse en accent, bleu acier = DEF, vermillon = ATK, ambre = donnée manquante */
:root {
  --bg: #edf1ec; --surface: #ffffff; --surface2: #f5f8f4; --ink: #14201a; --muted: #5a6a61; --line: #d6ded7;
  --accent: #0e6b49; --accent-ink: #ffffff; --accent-soft: #dcefe6;
  --def: #1b5fa6; --def-soft: #e0ecf8; --atk: #bf3f10; --atk-soft: #fbe6dc;
  --warn: #8a5100; --warn-soft: #fdf0d3; --warn-line: #e9c777;
  --bad: #b3261e; --bad-soft: #fbe4e1; --ok: #0e6b49; --ok-soft: #dcefe6;
  --shadow: 0 1px 2px rgba(20, 32, 26, .06), 0 4px 14px rgba(20, 32, 26, .05);

  --f-num: 'Barlow Condensed', 'Barlow', system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1511; --surface: #15211b; --surface2: #1a2922; --ink: #e5eee8; --muted: #94a69b; --line: #26382d;
    --accent: #48c18c; --accent-ink: #06130d; --accent-soft: #17382a;
    --def: #7db4ee; --def-soft: #16304b; --atk: #ff9a6e; --atk-soft: #4a2415;
    --warn: #f0c36a; --warn-soft: #382b10; --warn-line: #6b5420;
    --bad: #ff8f86; --bad-soft: #3d1a17; --ok: #48c18c; --ok-soft: #17382a;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1511; --surface: #15211b; --surface2: #1a2922; --ink: #e5eee8; --muted: #94a69b; --line: #26382d;
  --accent: #48c18c; --accent-ink: #06130d; --accent-soft: #17382a;
  --def: #7db4ee; --def-soft: #16304b; --atk: #ff9a6e; --atk-soft: #4a2415;
  --warn: #f0c36a; --warn-soft: #382b10; --warn-line: #6b5420;
  --bad: #ff8f86; --bad-soft: #3d1a17; --ok: #48c18c; --ok-soft: #17382a;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.4;
  padding-inline: 16px; padding-block: 0 112px; margin: 0 auto; max-width: 640px;
  background-image: repeating-linear-gradient(180deg, transparent 0 96px, rgba(14, 107, 73, .04) 96px 192px);
  -webkit-tap-highlight-color: transparent;
}
h1, h2, h3, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
small { font-size: 13px; color: var(--muted); }
b { font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.pad { padding: 14px 4px; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.hero { display: flex; flex-direction: column; gap: 12px; padding-block: 10px 6px; }
.hero h1 { font-family: var(--f-num); font-size: 34px; line-height: 1.05; font-weight: 700; text-wrap: balance; }
.hero .sub { color: var(--muted); font-size: 16px; }
.sec { border-left: 5px solid var(--accent); padding-left: 10px; font-family: var(--f-num); font-size: 22px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; margin-block: 22px 10px; }
.sec.in { margin-block: 0 8px; }

/* Boutons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; padding: 12px 18px;
  border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
  font-weight: 600; font-size: 17px; cursor: pointer; text-align: center; box-shadow: var(--shadow); user-select: none;
}
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.big { min-height: 64px; font-size: 19px; width: 100%; }
.btn.big svg { width: 26px; height: 26px; flex: none; }
.btn.small { min-height: 44px; padding: 8px 14px; font-size: 15px; }
.btn.ghost { background: transparent; box-shadow: none; }
.btn.danger { border-color: var(--bad); color: var(--bad); background: transparent; box-shadow: none; }
.btn.ghostd { margin-top: 10px; width: 100%; }

    var tk = tokens(name);
    var seen = {};
    exact.forEach(function (id) { seen[id] = 1; });
    var hasInitial = tk.some(function (t) { return t.length === 1; });

    idx.list.forEach(function (id) {
      if (seen[id]) return;
      var pk = idx.keyOf[id];
      if (!pk) return;
      var score = sim(key, pk), why = 'nom proche';
      var pt = pk.split(' ');
      // « P. Dupont » ↔ « Paul Dupont »
      if (hasInitial) {
        var rest = tk.filter(function (t) { return t.length > 1; });
        var inits = tk.filter(function (t) { return t.length === 1; });
        var okRest = rest.length && rest.every(function (t) { return pt.indexOf(t) >= 0; });
        var okInit = inits.every(function (c) {
          return pt.some(function (t) { return t.length > 1 && t.charAt(0) === c && rest.indexOf(t) < 0; });
        });
        if (okRest && okInit && score < 0.9) { score = 0.9; why = 'initiale'; }
      }
      // « Vinicius » ↔ « Vinicius Junior »
      if (score < FUZZY_MIN && tk.length && pt.length && tk.length !== pt.length) {
        var small = tk.length < pt.length ? tk : pt, big = tk.length < pt.length ? pt : tk;
        var inc = small.every(function (t) { return big.indexOf(t) >= 0; });
        var longTok = small.some(function (t) { return t.length >= 4; });
        if (inc && longTok) { score = Math.max(score, 0.8); why = 'nom partiel'; }
      }
      if (score >= FUZZY_MIN || (why !== 'nom proche' && score >= 0.8)) {
        cands.push({ id: id, score: score, why: why });
      }
    });

    cands.sort(function (a, b) { return b.score - a.score; });
    cands = cands.slice(0, 4);
    if (!cands.length) return { status: 'new', candidates: [] };
    return { status: 'confirm', candidates: cands };
  }

  /* ---------- Fusion / import ---------- */

  function randomId(chunks) {
    var c = Math.floor(Math.random() * (chunks || 48));
    var s = '';
    var chars = 'abcdefghjkmnpqrstuvwxyz23456789';
    for (var i = 0; i < 7; i++) s += chars.charAt(Math.floor(Math.random() * chars.length));
    return (c < 10 ? '0' : '') + c + '-' + s;
  }

  function clonePlayer(p) {
    return JSON.parse(JSON.stringify(p));
  }

  /* rows : [{name, def, atk, pos, club, unreadable}]
     decisions : { [rowIndex]: 'new' | 'skip' | playerId }
     keepOld   : { 'rowIndex:stat': true }
     meta      : { file, date }
     Ne modifie jamais `players`. Retourne les joueurs modifiés/créés. */
  function applyImport(players, rows, decisions, keepOld, meta) {
    decisions = decisions || {};
    keepOld = keepOld || {};
    meta = meta || {};
    var date = meta.date || new Date().toISOString();
    var file = meta.file || '';
    var work = {};      // copies modifiées
    var get = function (id) { return work[id] || players[id]; };
    var view = {};      // vue combinée pour l'index
    Object.keys(players).forEach(function (id) { view[id] = players[id]; });
    var idx = buildIndex(view);
    var report = { items: [], created: 0, completed: 0, updated: 0, unchanged: 0, skipped: 0, toconfirm: 0, conflicts: [] };

    rows.forEach(function (row, i) {
      var item = { i: i, row: row, status: null, result: null, id: null, candidates: [], changes: [] };
      report.items.push(item);
      if (!row.name || !nameKey(row.name)) { item.result = 'skipped'; report.skipped++; return; }

      var m = findMatch(view, idx, row.name, row.club, !!row.unreadable);
      item.status = m.status;
      item.candidates = m.candidates;
      var target = null;

      if (m.status === 'exact') {
        target = m.id;
      } else if (m.status === 'new') {
        target = 'new';
      } else {
        var d = decisions[i];
        if (d === 'new') target = 'new';
        else if (d === 'skip') { item.result = 'skipped'; report.skipped++; return; }
        else if (d && view[d]) target = d;
        else { item.result = 'toconfirm'; report.toconfirm++; return; }
      }

      var p, isNew = false;
      if (target === 'new') {
        isNew = true;
        p = { id: randomId(meta.chunks), name: String(row.name).trim().replace(/\s+/g, ' '), pos: row.pos || null,
          club: row.club || null, def: null, atk: null, src: {}, hist: [], created: date };
        work[p.id] = p;
        view[p.id] = p;
        indexAdd(idx, p);
      } else {
        if (!work[target]) work[target] = clonePlayer(players[target]);
        p = work[target];
        view[target] = p;
        if (!p.src) p.src = {};
        if (!p.hist) p.hist = [];
      }
      item.id = p.id;
      item.name = p.name;

      var filled = 0, changed = 0, same = 0;
      STATS.forEach(function (s) {
        var v = row[s];
        if (v == null) return;
        if (p[s] == null) {
          p[s] = v; p.src[s] = file; filled++;
          item.changes.push({ stat: s, old: null, now: v, kind: 'new' });
        } else if (p[s] === v) {
          same++;
        } else if (keepOld[i + ':' + s]) {
          item.changes.push({ stat: s, old: p[s], now: p[s], offered: v, kind: 'kept' });
          report.conflicts.push({ i: i, name: p.name, stat: s, old: p[s], now: v, kept: true });
        } else {
          p.hist.push({ stat: s, old: p[s], now: v, date: date, src: file });
          if (p.hist.length > 12) p.hist = p.hist.slice(-12);
          item.changes.push({ stat: s, old: p[s], now: v, kind: 'changed' });
          report.conflicts.push({ i: i, name: p.name, stat: s, old: p[s], now: v, kept: false });
          p[s] = v; p.src[s] = file; changed++;
        }
      });
      if (!p.pos && row.pos) p.pos = row.pos;
      if (!p.club && row.club) p.club = row.club;
      p.updated = date;

      if (isNew) { item.result = 'created'; report.created++; }
      else if (changed) { item.result = 'updated'; report.updated++; }
      else if (filled) { item.result = 'completed'; report.completed++; }
      else { item.result = 'unchanged'; report.unchanged++; }
    });

    report.players = work;
    return report;
  }

  /* ---------- Lecture de tableaux ---------- */

  function classifyHeader(cell) {
    var t = normText(cell);
    if (!t) return null;
    var tk = t.split(' ');
    var has = function (re) { return tk.some(function (x) { return re.test(x); }); };
    if (/^(prenom|first name|firstname|given name)$/.test(t) || t === 'first') return 'first';
    if (/^(nom de famille|last name|lastname|surname|family name)$/.test(t) || t === 'last') return 'last';
    if (/^(nom|nom du joueur|nom joueur|joueur|player|player name|name|footballeur|card|carte|nom complet|full name|joueurs|players)$/.test(t)) return 'name';
    var d = has(/^(def|dfn|dfs|defense|defence|defending|defensif|defensive)$/);
    var a = has(/^(atk|att|attack|attaque|attacking|offense|offensif|offensive|off)$/);
    if (d && !a) return 'def';
    if (a && !d) return 'atk';
    if (d && a) return null;
    if (/^(pos|position|poste|role)$/.test(t)) return 'pos';
    if (/^(club|equipe|team|squad)$/.test(t)) return 'club';
    if (/^(rang|rank|classement|place|n|no|num|numero)$/.test(t) || String(cell).trim() === '#') return 'rank';
    if (/^(score|valeur|value|stat|stats|statistique|points|pts|total|moyenne|avg|average|rating|note|niveau|level|power|puissance)$/.test(t)) return 'value';
    return null;
  }

  var JUNK_NAMES = /^(total|moyenne|average|rang|rank|joueur|player|nom|name|classement|top \d+)$/;

  function normPos(s) {
    if (s == null) return null;
    var t = normText(s);
    if (!t) return null;
    if (/^(gk|gardien|goalkeeper|goal|g)$/.test(t)) return 'GK';
    if (/^(def|df|defenseur|defender|d|defenseurs)$/.test(t)) return 'DEF';
    if (/^(mid|mf|milieu|midfielder|m|milieux)$/.test(t)) return 'MID';
    if (/^(att|atk|fwd|fw|st|attaquant|forward|striker|a|attaquants)$/.test(t)) return 'FWD';
    var raw = String(s).trim();
    return raw.length <= 12 ? raw.toUpperCase() : null;
  }

  function cellStr(c) { return c == null ? '' : String(c).trim(); }

  function looksLikeName(s) {
    s = cellStr(s);
    if (!s || s.length < 2) return false;
    if (!/\p{L}{2,}/u.test(s)) return false;
    if (/^\d+([.,]\d+)?$/.test(s)) return false;
    return true;
  }

  /* rows : tableau de tableaux. hint : 'def' | 'atk' | null (étiquette d'une colonne sans titre). */
  function parseTable(rows, hint) {
    var out = { rows: [], notes: [], headerFound: false };
    var hdrIdx = -1, cols = null, r, c;

    for (r = 0; r < Math.min(rows.length, 30); r++) {
      var cl = (rows[r] || []).map(classifyHeader);
      var hasName = cl.indexOf('name') >= 0 || (cl.indexOf('first') >= 0 && cl.indexOf('last') >= 0) || cl.indexOf('last') >= 0;
      var hasVal = cl.indexOf('def') >= 0 || cl.indexOf('atk') >= 0 || cl.indexOf('value') >= 0;
      if (hasName && hasVal) { hdrIdx = r; cols = cl; break; }
    }

    var map = {}; // type -> index
    if (hdrIdx >= 0) {
      out.headerFound = true;
      cols.forEach(function (t, i) { if (t && map[t] == null) map[t] = i; });
    } else {
      // Sans titres : on devine les colonnes.
      var width = 0;
      rows.forEach(function (row) { if (row && row.length > width) width = row.length; });
      var info = [];
      for (c = 0; c < width; c++) {
        var txt = 0, num = 0, ints = [];
        rows.forEach(function (row) {
          var v = row ? row[c] : null;
          if (cellStr(v) === '') return;
          if (parseNum(v) != null && /^[\s\d.,+-]+$/.test(cellStr(v))) { num++; ints.push(parseNum(v)); }
          else if (looksLikeName(v)) txt++;
        });
        info.push({ c: c, txt: txt, num: num, ints: ints });
      }
      var nameCol = info.slice().sort(function (a, b) { return b.txt - a.txt; })[0];
      if (!nameCol || nameCol.txt < 1) { out.notes.push('Aucune colonne de noms de joueurs détectée.'); return out; }
      map.name = nameCol.c;
      var numCols = info.filter(function (x) { return x.num >= Math.max(1, nameCol.txt * 0.5) && x.c !== nameCol.c; });
      // colonne de rang : entiers croissants 1..n
      numCols = numCols.filter(function (x) {
        var asc = x.ints.length > 2 && x.ints.every(function (v, i) { return v === i + 1 || (i > 0 && v === x.ints[i - 1] + 1); });
        if (asc && x.c < nameCol.c) { map.rank = x.c; return false; }
        return true;
      });
      if (numCols.length === 1) map.value = numCols[0].c;
      else if (numCols.length >= 2) {
        map.value = numCols[0].c;
        out.notes.push('Plusieurs colonnes de chiffres sans titre : seule la première est utilisée.');
      }
      hdrIdx = -1;
    }

    var start = hdrIdx + 1;
    var valueHint = hint || null;
    for (r = start; r < rows.length; r++) {
      var row = rows[r] || [];
      var name;
      if (map.first != null && (map.last != null || map.name != null)) {
        name = (cellStr(row[map.first]) + ' ' + cellStr(row[map.last != null ? map.last : map.name])).trim();
      } else if (map.name != null) name = cellStr(row[map.name]);
      else name = cellStr(row[map.last]);
      name = name.replace(/^#?\d{1,4}\s*[.)\-:]\s*/, '');
      if (!name) continue;
      if (!looksLikeName(name)) continue;
      if (JUNK_NAMES.test(normText(name))) continue;
      var rec = { name: name.replace(/\s+/g, ' '), def: null, atk: null, pos: null, club: null };
      if (map.def != null) rec.def = parseNum(row[map.def]);
      if (map.atk != null) rec.atk = parseNum(row[map.atk]);
      if (map.value != null && map.def == null && map.atk == null) {
        var v = parseNum(row[map.value]);
        if (v != null) { if (valueHint) rec[valueHint] = v; else rec.unk = v; }
      }
      if (map.pos != null) rec.pos = normPos(row[map.pos]);
      if (map.club != null) rec.club = cellStr(row[map.club]) || null;
      out.rows.push(rec);
    }
    return out;
  }

  /* Indice DEF/ATK d'après le nom du fichier ou de la feuille. */
  function detectHint(label) {
    var t = normText(label);
    if (!t) return null;
    var d = /(^| )(def|dfn|defens\w*|defend\w*|defenseur\w*|defenceman)( |$)/.test(t) || /defens|defend/.test(t);
    var a = /(^| )(atk|att|attaq\w*|attack\w*|offens\w*|striker\w*|forward\w*|fwd)( |$)/.test(t) || /attaq|attack|offens/.test(t);
    if (d && !a) return 'def';
    if (a && !d) return 'atk';
    return null;
  }

  function resolveUnknown(rows, stat) {
    rows.forEach(function (r) {
      if (r.unk != null) { if (r[stat] == null) r[stat] = r.unk; delete r.unk; }
    });
    return rows;
  }


  /* ---------- CSV ---------- */

  function parseCSV(text) {
    text = String(text || '').replace(/^﻿/, '');
    var first = text.split(/\r?\n/).slice(0, 8).join('\n');
    var best = ',', bestN = -1;
    [';', ',', '\t', '|'].forEach(function (d) {
      var n = first.split(d).length - 1;
      if (n > bestN) { bestN = n; best = d; }
    });
    var rows = [], row = [], cur = '', q = false, i, ch;
    for (i = 0; i < text.length; i++) {
      ch = text.charAt(i);
      if (q) {
        if (ch === '"') { if (text.charAt(i + 1) === '"') { cur += '"'; i++; } else q = false; }
        else cur += ch;
      } else if (ch === '"') q = true;
      else if (ch === best) { row.push(cur); cur = ''; }
      else if (ch === '\n' || ch === '\r') {
        if (ch === '\r' && text.charAt(i + 1) === '\n') i++;
        row.push(cur); cur = '';
        if (row.some(function (x) { return x !== ''; })) rows.push(row);
        row = [];
      } else cur += ch;
    }
    row.push(cur);
    if (row.some(function (x) { return x !== ''; })) rows.push(row);
    return rows;
  }


  /* ---------- Exports PDF « Snatch Watch » ---------- */

  /* Reconstruit des lignes de texte à partir des morceaux de texte d'une page PDF (pdf.js). */
  function pdfItemsToText(items) {
    var rows = [];
    items.forEach(function (it) {
      if (!it.str || !it.str.trim()) return;
      var x = it.transform[4], y = it.transform[5];
      var row = rows.filter(function (r) { return Math.abs(r.y - y) < 2.5; })[0];
      if (!row) { row = { y: y, items: [] }; rows.push(row); }
      row.items.push({ x: x, str: it.str, w: it.width || 0 });
    });
    rows.sort(function (a, b) { return b.y - a.y; });
    return rows.map(function (r) {
      r.items.sort(function (a, b) { return a.x - b.x; });
      var s = '', end = null;
      r.items.forEach(function (i) {
        if (end != null) { var gap = i.x - end; s += gap > 8 ? '\t' : (gap > 1 ? ' ' : ''); }
        s += i.str; end = i.x + i.w;
      });
      return s;
    }).join('\n');
  }

  var SW_POS = /^(GOALKEEPER|DEFENDER|MIDFIELDER|FORWARD)\s*[·•|]\s*(.+)$/i;
  var SW_RANK = /^(\d{1,3})\s+(\S.*?)\s+(\d{1,3}(?:[.,]\d+)?)$/;
  var SW_LIST = /^(\d{1,3}(?:[.,]\d+)?)\s+(\d{1,3}(?:[.,]\d+)?)\s+IR\b/;

  function prettyClub(slug) {
    var parts = String(slug || '').trim().toLowerCase().split('-').filter(Boolean);
    if (parts.length % 2 === 0 && parts.length > 0) {
      var h = parts.length / 2;
      if (parts.slice(0, h).join('-') === parts.slice(h).join('-')) parts = parts.slice(0, h);
    }
    return parts.map(function (p) { return p.charAt(0).toUpperCase() + p.slice(1); }).join(' ') || null;
  }

  /* Nettoie les éléments d'interface qui se mélangent au texte : bandeau « Snatch Watch · Updated 2d ago »,
     barre d'onglets « Legendary Goat ATK DEF History », bouton « : », en-tête « Sort by IR … ». */
  function swCleanLines(text) {
    var out = [];
    String(text || '').split(/\r?\n/).forEach(function (raw) {
      var l = raw.replace(/ /g, ' ').trim();
      if (!l) return;
      l = l.replace(/\s*\bUpdated\s+\S+(?:\s+\S+)?\s+ago\b.*$/i, '').trim();
      if (!l || l === ':' || /^Legendary\b.*\bHistory$/i.test(l) || /^Sort by IR\b/i.test(l) || /^\d+\s+players$/i.test(l)) return;
      var flags = { snatch: false, watch: false };
      var m;
      if ((m = /^Snatch\s*Watch\b\s*(.*)$/i.exec(l))) { l = m[1].trim(); flags.snatch = flags.watch = true; }
      else if ((m = /^Snatch(?=\p{Lu})(.*)$/u.exec(l))) { l = m[1].trim(); flags.snatch = true; }
      else if ((m = /^Watch(?=\p{Lu})(.*)$/u.exec(l)) || (m = /^Watch\s+(\S.*)$/.exec(l))) { l = m[1].trim(); flags.watch = true; }
      else if (/^(Snatch|Watch)$/i.test(l)) return;
      if (!l) return;
      out.push({ t: l, snatch: flags.snatch, watch: flags.watch });
    });
    // Cas où le bandeau recouvre le nom en le coupant en deux lignes (« SnatchNicolas » / « WatchPépé »)
    var merged = [];
    for (var i = 0; i < out.length; i++) {
      var cur = out[i], nxt = out[i + 1];
      if (cur.snatch && !cur.watch && nxt && nxt.watch && !SW_POS.test(cur.t) && !SW_POS.test(nxt.t) && !SW_RANK.test(cur.t)) {
        merged.push(cur.t + ' ' + nxt.t); i++;
      } else merged.push(cur.t);
    }
    return merged;
  }

  function parseSnatchWatch(text) {
    var lines = swCleanLines(text);
    if (!lines.some(function (l) { return SW_POS.test(l); })) return null;
    var stat = null, declared = null, title = null, m, i;
    for (i = 0; i < Math.min(lines.length, 12); i++) {
      if ((m = /^Top\s+(\d+)\s+.*?\bby\s+(defending|attacking)\s*score\b/i.exec(lines[i]))) {
        declared = parseInt(m[1], 10); stat = /^def/i.test(m[2]) ? 'def' : 'atk'; title = lines[i]; break;
      }
    }
    var rawText = String(text || ''); // « 73 players » est retiré du nettoyage : on le relit ici
    var pm = /(\d+)\s+players/i.exec(rawText);
    if (pm && declared == null) declared = parseInt(pm[1], 10);

    var rows = [], skipped = [];
    for (i = 0; i < lines.length; i++) {
      var pos = SW_POS.exec(lines[i]);
      if (!pos) continue;
      var prev = lines[i - 1] || '', next = lines[i + 1] || '';
      var rec = { name: null, def: null, atk: null, pos: normPos(pos[1]), club: prettyClub(pos[2]) };
      var rk = SW_RANK.exec(prev), ls = SW_LIST.exec(next);
      if (rk && !ls) {
        rec.name = rk[2].trim();
        var v = parseNum(rk[3]);
        if (stat) rec[stat] = v; else rec.unk = v;
      } else if (ls && !rk) {
        rec.name = prev.trim();
        rec.atk = parseNum(ls[1]); rec.def = parseNum(ls[2]); // 1er nombre = ATK, 2e = DEF (vérifié par recoupement avec les classements)
      } else {
        skipped.push(prev || '(ligne vide)');
        continue;
      }
      if (!looksLikeName(rec.name)) { skipped.push(rec.name || '(sans nom)'); continue; }
      rows.push(rec);
    }
    var warnings = [];
    if (declared != null && rows.length !== declared) {
      warnings.push('Le PDF annonce ' + declared + ' joueurs, mais ' + rows.length + ' ont été lus' + (skipped.length ? ' (non lus : ' + skipped.slice(0, 5).join(', ') + ')' : '') + '. Vérifiez avant d\'enregistrer.');
    } else if (skipped.length) {
      warnings.push(skipped.length + ' entrée' + (skipped.length > 1 ? 's' : '') + ' non lue' + (skipped.length > 1 ? 's' : '') + ' : ' + skipped.slice(0, 5).join(', ') + '.');
    }
    var notes = ['Export « Snatch Watch » reconnu' + (title ? ' : ' + title : (stat ? '' : ' (liste ATK + DEF)')) + (declared != null ? ' · ' + declared + ' joueurs annoncés, ' + rows.length + ' lus' : '') + '.'];
    return { rows: rows, notes: notes, warnings: warnings, headerFound: true, format: 'snatch-watch', declared: declared };
  }

  /* ---------- Texte libre (PDF, copier-coller) ---------- */

  function parseLine(line, hint) {
    var s = line.replace(/ /g, ' ').trim();
    if (!s) return null;
    s = s.replace(/^\s*#?\d{1,4}\s*[.)\-:]?\s+(?=\p{L})/u, '');
    var rec = { name: null, def: null, atk: null, pos: null, club: null };
    var labelRe = /\b(def\w*|dfn|atk|att\w*)\s*[:=]?\s*(-?\d+(?:[.,]\d+)?)/gi, m, anyLabel = false;
    var cleaned = s;
    while ((m = labelRe.exec(s))) {
      var lab = normText(m[1]);
      var st = /^(def|dfn|defen\w*)/.test(lab) ? 'def' : (/^(atk|att|attaq\w*|attack\w*)/.test(lab) ? 'atk' : null);
      if (st) { rec[st] = parseNum(m[2]); anyLabel = true; }
    }
    if (anyLabel) cleaned = s.replace(labelRe, ' ');
    var nm = cleaned.match(/^\s*([\p{L}][\p{L}'’.\- ]*?)(?=\s+[-\d]|\s*$)/u);
    if (!nm) return null;
    rec.name = nm[1].trim();
    if (!anyLabel) {
      var rest = cleaned.slice(nm[0].length);
      var nums = rest.match(/-?\d+(?:[.,]\d+)?/g);
      if (nums && nums.length) {
        var v = parseNum(nums[nums.length > 1 ? 1 : 0]);
        // « 1 Paul Dupont 82 » : si plusieurs nombres, le premier est souvent un rang déjà retiré ; on prend le dernier
        v = parseNum(nums[nums.length - 1]);
        if (hint) rec[hint] = v; else rec.unk = v;
      }
    }
    if (!looksLikeName(rec.name) || JUNK_NAMES.test(normText(rec.name))) return null;
    if (rec.def == null && rec.atk == null && rec.unk == null) return null;
    return rec;
  }

  function parseText(text, hint) {
    var sw = parseSnatchWatch(text);

      ids.forEach(function (id) { var c = chunkOf(id); if (chunkSet[c]) (byChunk[c] = byChunk[c] || {})[id] = S.db.players[id]; });

  /* ---------- Lecture des fichiers ---------- */
  function readText(file) {
    return file.arrayBuffer().then(function (buf) {
      var t = new TextDecoder('utf-8').decode(buf);
      if (t.indexOf(String.fromCharCode(65533)) >= 0) { try { t = new TextDecoder('windows-1252').decode(buf); } catch (e) { /* garde utf-8 */ } }
      return t;

  function loadBitmap(blob) {
    if (window.createImageBitmap) {
      return createImageBitmap(blob, { imageOrientation: 'from-image' }).catch(function () { return viaImg(blob); });
    }
    return viaImg(blob);
  }
  function viaImg(blob) {
    return new Promise(function (res, rej) {
      var u = URL.createObjectURL(blob), im = new Image();
      im.onload = function () { res(im); };
      im.onerror = function () { rej(new Error('Image illisible')); };
      im.src = u;
    });
  }
  function canvasBlob(cv) {

  }
  /* Coupe une image très haute en tranches qui se chevauchent, pour garder les petits caractères lisibles. */
  function sliceImage(file, maxRatio) {
    return loadBitmap(file).then(function (bmp) {
      var w = bmp.width, h = bmp.height;
      if (h / w <= maxRatio) return [file];
      var segH = Math.round(w * maxRatio * 0.9), step = Math.round(segH * 0.88);
      var out = [], y = 0, chain = Promise.resolve();
      var spans = [];
      while (true) {
        if (y + segH >= h) { spans.push([Math.max(0, h - segH), h]); break; }
        spans.push([y, y + segH]); y += step;
      }
      spans.forEach(function (sp) {
        chain = chain.then(function () {
          var cv = document.createElement('canvas');
          cv.width = w; cv.height = sp[1] - sp[0];
          cv.getContext('2d').drawImage(bmp, 0, sp[0], w, cv.height, 0, 0, w, cv.height);
          return canvasBlob(cv).then(function (b) { out.push(b); });
        });
      });
      return chain.then(function () { return out; });
    });
  }

  function readPdf(file, job, mode, hint) {
    var base = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
    return (window.pdfjsLib ? Promise.resolve() : loadScript(base + 'pdf.min.js')).then(function () {
      return window.pdfjsWorker ? null : loadScript(base + 'pdf.worker.min.js').catch(function () { return null; });
    }).then(function () {

    }).then(function (buf) {
      return window.pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise;
    }).then(function (pdf) {
      var texts = [], seq = Promise.resolve();
      for (var n = 1; n <= pdf.numPages; n++) {
        (function (pn) {
          seq = seq.then(function () { return pdf.getPage(pn); }).then(function (pg) { return pg.getTextContent(); })
            .then(function (tc) { texts.push(C.pdfItemsToText(tc.items)); });
        })(n);
      }
      return seq.then(function () {
        var text = texts.join('\n');
        var parsed = C.parseText(text, hint);
        if (parsed.rows.length >= 3) {
          parsed.notes.forEach(function (n) { job.notes.push(n); });
          (parsed.warnings || []).forEach(function (w) { job.warnings.push(w); });
          job.notes.push('Texte du PDF lu directement (' + pdf.numPages + ' page' + (pdf.numPages > 1 ? 's' : '') + ').');
          return parsed.rows;
        }
        if (S.sample && text.replace(/\s/g, '').length > 80) {
          job.notes.push('Mise en page complexe : lecture par Claude.');
          return aiStatsFromText(text, mode, hint, job.ctl);
        }
        if (!imagesOK()) return [];
        job.notes.push('PDF scanné : lecture des pages en image par Claude.');
        var blobs = [], chain = Promise.resolve();
        for (var p = 1; p <= Math.min(pdf.numPages, 12); p++) {
          (function (pn) {
            chain = chain.then(function () { return pdf.getPage(pn); }).then(function (pg) {
              var vp0 = pg.getViewport({ scale: 1 }), scale = Math.min(2.5, 1300 / vp0.width);
              var vp = pg.getViewport({ scale: scale }), cv = document.createElement('canvas');
              cv.width = vp.width; cv.height = vp.height;
              return pg.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise.then(function () { return canvasBlob(cv); });
            }).then(function (b) { blobs.push(b); });
          })(p);
        }
        return chain.then(function () { return aiStatsFromImages(blobs, mode, hint, job.ctl); });
      });
    });
  }

  function readExcel(file, job, mode, hint) {
    var url = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    return (window.XLSX ? Promise.resolve() : loadScript(url)).then(function () { return file.arrayBuffer(); }).then(function (buf) {
      var wb = window.XLSX.read(buf, { type: 'array' });
      var rows = [];
      wb.SheetNames.forEach(function (sn) {

        var h = hint || C.detectHint(sn);

        p.notes.forEach(function (n) { job.notes.push(n); });

  function readJob(job, file) {
    var ext = (file.name.split('.').pop() || '').toLowerCase();
    var mode = job.mode;
    var hint = mode === 'def' || mode === 'atk' ? mode : (mode === 'both' ? null : C.detectHint(file.name));
    job.hint = hint;
    var p;
    if (['xlsx', 'xlsm', 'xls', 'ods'].indexOf(ext) >= 0) { job.kind = 'Excel'; p = readExcel(file, job, mode, hint); }
    else if (ext === 'pdf') { job.kind = 'PDF'; p = readPdf(file, job, mode, hint); }
    else if (file.type.indexOf('image/') === 0 || ['png', 'jpg', 'jpeg', 'webp', 'gif', 'heic', 'heif'].indexOf(ext) >= 0) {
      job.kind = 'Image';
      if (LOCAL) {
        p = ocrImageToText(file, job).then(function (t) {
          var r = C.parseText(t, hint);
          r.notes.forEach(function (n) { job.notes.push(n); });
          (r.warnings || []).forEach(function (w) { job.warnings.push(w); });
          if (r.rows.length) job.warnings.push('Image lue par reconnaissance de texte sur l\'appareil : relisez les noms et les chiffres avant d\'enregistrer. Un PDF, un Excel ou un CSV est toujours plus fiable.');
          return r.rows;
        });
        return p;
      }
      if (!imagesOK()) return Promise.reject(new Error(noImagesMsg()));
      p = sliceImage(file, 1.7).then(function (blobs) {
        if (blobs.length > 1) job.notes.push('Image haute découpée en ' + blobs.length + ' parties pour une meilleure lecture.');
        return aiStatsFromImages(blobs, mode, hint, job.ctl);
      });
    } else if (ext === 'csv' || ext === 'tsv') {
      job.kind = 'CSV';
      p = readText(file).then(function (t) {
        var r = C.parseTable(C.parseCSV(t), hint);
        if (!r.rows.length) r = C.parseText(t, hint);
        r.notes.forEach(function (n) { job.notes.push(n); });
        return r.rows;
      });
    } else if (ext === 'txt' || file.type.indexOf('text/') === 0) {
      job.kind = 'Texte';
      p = readText(file).then(function (t) { var r = C.parseText(t, hint); r.notes.forEach(function (n) { job.notes.push(n); }); (r.warnings || []).forEach(function (w) { job.warnings.push(w); }); return r.rows; });
    } else {
      return Promise.reject(new Error('Format non pris en charge (' + (ext || file.type || 'inconnu') + '). Utilisez CSV, Excel, PDF ou une image.'));
    }
    return p;
  }

        if (unresolved) h += '<p class="note warn">' + plural(unresolved, 'joueur n\'est', 'joueurs ne sont') + ' pas reconnu' + (unresolved > 1 ? 's' : '') + ' avec certitude : leurs statistiques sont comptées comme manquantes tant que vous ne les avez pas confirmés.</p>';
        h += '<div class="members">' + t.members.map(renderMember).join('') + '</div>';
      }
      h += '<div class="row gap"><button class="btn" data-act="add-member">+ Ajouter un joueur</button>' +
        (t.img && t.state === 'done' ? '<button class="btn ghost" data-act="rerun-shot">Relire la capture</button>' : '') + '</div>';
    }

    if (t.members.length) {
      h += renderBonusPanel();
      h += '<div id="results">' + renderResults() + '</div>';
    }
    return h;
  }

  function renderMember(m) {
    var p = m.id ? S.db.players[m.id] : null, e = effStats(m);
    var st = !m.id ? (m.status === 'new' ? badge('bad', 'Inconnu') : badge('warn', 'À confirmer'))
      : (m.status === 'exact' ? badge('ok', 'Reconnu') : badge('ok', 'Confirmé'));
    var h = '<article class="member' + (m.id ? '' : ' unres') + '" data-key="' + m.key + '">';
    h += '<div class="mhead"><div><div class="mname">' + esc(p ? p.name : m.name) + '</div>';
    var sub = [];
    if (p && m.name !== p.name) sub.push('lu : « ' + esc(m.name) + ' »');
    var pos = (p && p.pos) || m.pos, club = (p && p.club) || m.club;
    if (pos) sub.push(esc(pos) + (!(p && p.pos) && m.posSrc ? (m.posSrc === 'carte' ? ' (lu sur la carte)' : ' (déduit de l\'ordre)') : '')); if (club) sub.push(esc(club));
    if (sub.length) h += '<div class="msub">' + sub.join(' · ') + '</div>';
    h += '</div>' + st + '</div>';
    if (m.unreadable) h += '<p class="note warn small">Nom difficile à lire sur la capture. Vérifiez-le.</p>';
    h += '<div class="chips">' + STATS.map(function (s) { return chip(s, e[s], e.src[s]); }).join('') + '</div>';
    STATS.forEach(function (s) {
      var d = e.src[s + 'Diff'];
      if (d) {
        var useSeen = m.useSeen && m.useSeen[s];
        h += '<p class="note warn small">' + STAT_LABEL[s] + ' : la capture indique ' + fmt(d.seen) + ', la base ' + fmt(d.db) + '. ' +
          '<button class="link" data-act="toggle-seen" data-key="' + m.key + '" data-stat="' + s + '">' + (useSeen ? 'Utiliser la base (' + fmt(d.db) + ')' : 'Utiliser la capture (' + fmt(d.seen) + ')') + '</button></p>';
      }
    });
    if (!m.id && m.candidates.length) {
      h += '<div class="cands"><div class="lbl">Est-ce l\'un de ces joueurs ?</div>';
      m.candidates.forEach(function (c) {
        var cp = S.db.players[c.id]; if (!cp) return;
        h += '<button class="cand-btn" data-act="pick-cand" data-key="' + m.key + '" data-id="' + esc(c.id) + '"><span><b>' + esc(cp.name) + '</b>' + (cp.club ? ' · ' + esc(cp.club) : '') + '</span><span class="chips tiny">' + playerChips(cp) + '</span></button>';
      });
      h += '</div>';
    }
    h += '<div class="mactions">';
    h += '<button class="btn small" data-act="change-member" data-key="' + m.key + '">' + (m.id ? 'Changer de joueur' : 'Chercher dans la base') + '</button>';
    h += '<button class="btn small ghost" data-act="rename-member" data-key="' + m.key + '">Corriger le nom lu</button>';
    h += '<button class="btn small ghost" data-act="remove-member" data-key="' + m.key + '">Retirer</button>';
    h += '</div>';
    if (m.skillsRead && m.skillsRead.length) {
      h += '<p class="note small skread">Compétences lues sur la carte : ' + m.skillsRead.map(function (x) {
        var kk = C.SKILLS.filter(function (k) { return k.key === x.key; })[0];
        return '<span class="skchip">' + skImg(x.key) + esc(kk ? kk.name : (SK_NAME[x.key] || x.key)) + (x.count > 1 ? ' x' + x.count : '') + (kk ? '' : ' (sans effet DEF/ATK)') + (x.sure ? '' : ' (chiffre à vérifier)') + '</span>';
      }).join(' ') + '</p>';
    }
    var anySk = C.SKILLS.some(function (k) { return m.skills && m.skills[k.key] > 0; });
    h += '<div class="lbl">Compétences · touchez pour ajouter (encore pour x2, x3…), − pour retirer</div><div class="mactions skills">' + C.SKILLS.map(function (k) {
      var n = (m.skills && m.skills[k.key]) || 0;
      var eff = (k.atk ? (k.atk > 0 ? '+' : '') + k.atk + ' ATK' : '') + (k.atk && k.def ? ' ' : '') + (k.def ? (k.def > 0 ? '+' : '') + k.def + ' DEF' : '');
      return '<div class="skcell"><button class="btn small' + (n ? '' : ' ghost') + '" data-act="skill" data-key="' + m.key + '" data-sk="' + k.key + '">' + '<span class="skicow">' + skImg(k.key) + (n > 1 ? '<span class="skn">' + n + '</span>' : '') + '</span><span class="sktx"><b>' + k.name + '</b><small>' + eff + '</small></span></button>' +
        (n ? '<button class="btn small skminus" data-act="skill-minus" data-key="' + m.key + '" data-sk="' + k.key + '" aria-label="Retirer une ' + esc(k.name) + '">−</button>' : '') + '</div>';
    }).join('') + '</div>';
    if (anySk) h += '<button class="btn small ghost danger" data-act="skill-clear" data-key="' + m.key + '">Retirer toutes les compétences</button>';
    var rp = C.roleStat(pos);
    if (rp) h += '<label class="check"><input type="checkbox" data-field="main" data-key="' + m.key + '"' + (S.mainsOff[m.key] ? '' : ' checked') + '><span>Peut être le joueur principal en ' + (rp === 'def' ? 'défense' : 'attaque') + '</span></label>';
    else h += '<p class="note small">' + (pos ? 'Jamais joueur principal (' + esc(pos) + ') : sa note compte à 25 %.' : 'Poste inconnu : indiquez-le pour savoir s\'il peut être joueur principal.') + '</p>';
    h += '</article>';
    return h;
  }

  function renderBonusPanel() {
    var b = S.bonus;
    function f(id, label, val, ph, hint) {
      return '<label class="field"><span>' + label + '</span><input id="b-' + id + '" data-field="bonus" data-name="' + id + '" type="text" inputmode="decimal" autocomplete="off" placeholder="' + ph + '" value="' + esc(val) + '">' + (hint ? '<small>' + hint + '</small>' : '') + '</label>';
    }
    var h = '<section class="card"><h2 class="sec in">Bonus</h2><p class="muted small">Le nombre saisi est ajouté tel quel au total. Laissez vide s\'il n\'y en a pas.</p>';
    h += '<div class="grid2">' + f('def', 'Bonus DEF (+)', b.def, '0', '') + f('atk', 'Bonus ATK (+)', b.atk, '0', '') + '</div>';
    h += '<div class="grid2">' + f('clubDef', 'Bonus de club DEF', b.clubDef, 'vide = non confirmé', 'Ajouté seulement si rempli') + f('clubAtk', 'Bonus de club ATK', b.clubAtk, 'vide = non confirmé', 'Ajouté seulement si rempli') + '</div>';
    h += '<details class="more"><summary>Critique (aléatoire, facultatif)</summary><p class="muted small">Les critiques sont aléatoires : elles ne sont jamais incluses dans le total. Si vous connaissez leur valeur, elle est affichée à part.</p>';
    h += '<div class="grid2">' + f('critDef', 'Critique DEF (+)', b.critDef, 'inconnu', '') + f('critAtk', 'Critique ATK (+)', b.critAtk, 'inconnu', '') + '</div></details>';
    h += '<p class="muted small">Compétences : touchez une compétence sur la carte du joueur pour l\'ajouter (touchez encore pour x2, x3…). Leur DEF/ATK s\'ajoute au score final de l\'équipe (pas à la carte) ; Income ignoré ; Crit non inclus.</p></section>';
    return h;
  }

  function renderResults() {
    var r = teamCalc();
    if (!r) return '';
    if (!r.calc) return '<section class="card alert warn"><p>Cochez au moins un joueur qui peut être le joueur principal.</p></section>';
    var rules = r.calc.rules;
    var h = '<div class="goalbar"><h2 class="sec in">Résultat</h2><div class="goalgif" aria-hidden="true"></div></div>';
    h += '<p class="muted small rule">Défense : le joueur principal est un défenseur. Attaque : le joueur principal est un attaquant. Les autres cartes comptent au taux support. Un joueur sans note (absent du classement) reçoit la note du 50e moins 1' +
      (S.db.floors.def || S.db.floors.atk ? ' (' + STATS.filter(function (x) { return S.db.floors[x]; }).map(function (x) { return STAT_LABEL[x] + ' ' + fmt(S.db.floors[x].value - 1); }).join(', ') + ')' : ' (importez le Top 50 pour l\'activer)') + '.</p>';
    if (r.calc.unknownPos && r.calc.unknownPos.length) h += '<p class="note warn small">Poste inconnu (compté comme support, ne peut pas être joueur principal) : ' + r.calc.unknownPos.map(esc).join(', ') + '. Renseignez son poste dans sa fiche.</p>';
    h += '<p class="muted small rule">Règle : principal ' + fmt(rules.mainPct) + ' %, chaque support ' + fmt(rules.supportPct) + ' %, ' +
      ({ ceil: 'arrondi à l\'entier supérieur', round: 'arrondi à l\'entier le plus proche', floor: 'arrondi à l\'entier inférieur', none: 'sans arrondi' }[rules.rounding]) + ' pour chaque support. ' +
      plural(r.calc.size, 'joueur', 'joueurs') + ' dans l\'équipe.</p>';
    STATS.forEach(function (s) { h += renderStatResult(s, r.calc[s]); });
    return h;
  }

  function renderStatResult(s, res) {
    var L = STAT_LABEL[s];
    if (res.none) {
      return '<section class="card stat ' + s + '"><header class="shead"><h3>' + (s === 'def' ? 'Défense' : 'Attaque') + ' adverse</h3><span class="big warn">—</span></header><p class="note warn">' +
        (res.none === 'no-source' ? 'Aucun ' + (s === 'def' ? 'défenseur' : 'attaquant') + ' identifié dans l\'équipe (poste manquant ?) : ' + L + ' non calculable. Renseignez le poste dans la fiche du joueur.' : 'Cochez au moins un ' + (s === 'def' ? 'défenseur' : 'attaquant') + ' qui peut être le joueur principal.') + '</p></section>';
    }
    var cands = res.candidates.slice().sort(function (a, b) {
      if (a.mainMissing !== b.mainMissing) return a.mainMissing ? 1 : -1;
      return b.total - a.total;
    });
    var h = '<section class="card stat ' + s + '"><header class="shead"><h3>' + (s === 'def' ? 'Défense' : 'Attaque') + ' adverse</h3>';
    var headline;
    if (res.min == null) headline = '<span class="big warn">incomplet</span>';
    else if (res.min === res.max) headline = '<span class="big">' + fmt(res.min) + '</span>';
    else headline = '<span class="big">' + fmt(res.min) + ' <small>à</small> ' + fmt(res.max) + '</span>';
    h += headline + '</header>';
    var anyMissing = cands.some(function (c) { return !c.complete; });
    if (anyMissing) {
      var names = {};
      cands.forEach(function (c) { c.missingNames.forEach(function (n) { names[n] = 1; }); });
      h += '<p class="note warn">Statistique ' + L + ' manquante pour : ' + Object.keys(names).map(esc).join(', ') + '. Les totaux marqués « au moins » ne comptent pas ces joueurs.</p>';
    }
    h += '<div class="cl">';
    cands.forEach(function (c, i) {
      var open = i === 0 && cands.length <= 3 ? ' open' : '';
      var tot = c.mainMissing ? '<span class="tot warn">impossible</span>' : '<span class="tot">' + (c.complete ? '' : '<small>au moins </small>') + fmt(c.total) + '</span>';
      h += '<details class="cand"' + open + '><summary><span>Principal : <b>' + esc(c.mainName) + '</b></span>' + tot + '</summary>';
      if (c.mainMissing) h += '<p class="note warn small">' + esc(c.mainName) + ' n\'a pas de ' + L + ' connue : impossible de calculer ce cas.</p>';
      h += '<div class="tw"><table><thead><tr><th>Joueur</th><th>Base</th><th>Part</th></tr></thead><tbody>';
      c.lines.forEach(function (l) {
        var raw = l.base == null ? null : l.base * l.pct / 100;
        var part = l.contrib == null ? '<span class="warn">manquante</span>' :
          (Math.abs(raw - l.contrib) > 1e-9 ? fmt(raw) + ' → <b>' + fmt(l.contrib) + '</b>' : '<b>' + fmt(l.contrib) + '</b>');
        h += '<tr class="' + l.role + '"><td>' + esc(l.name) + '<small>' + (l.role === 'principal' ? 'principal' : 'support') + ' · ' + fmt(l.pct) + '\u00a0%' + (l.est ? ' · estimé (50e − 1)' : '') + '</small></td><td>' + (l.base == null ? '—' : fmt(l.base)) + '</td><td>' + part + '</td></tr>';
      });
      h += '</tbody><tfoot>';
      h += '<tr><td colspan="2">Sous-total</td><td>' + fmt(c.subtotal) + '</td></tr>';
      if (c.skills) h += '<tr><td colspan="2">Compétences</td><td>' + (c.skills > 0 ? '+ ' : '− ') + fmt(Math.abs(c.skills)) + '</td></tr>';
      h += '<tr><td colspan="2">Bonus ' + L + '</td><td>+ ' + fmt(c.bonus) + '</td></tr>';
      h += '<tr><td colspan="2">Bonus de club</td><td>' + (c.club == null ? '<span class="muted">non confirmé, pas ajouté</span>' : '+ ' + fmt(c.club)) + '</td></tr>';
      h += '<tr class="total"><td colspan="2">Total ' + L + (c.complete ? '' : ' (minimum)') + '</td><td>' + fmt(c.total) + '</td></tr>';
      if (c.critTotal != null) h += '<tr class="crit"><td colspan="2">Si critique (aléatoire, à part) : +' + fmt(c.crit) + '</td><td>' + fmt(c.critTotal) + '</td></tr>';
      h += '</tfoot></table></div></details>';
    });
    h += '</div></section>';
    return h;
  }

  /* ---------- Rendu : Importer ---------- */
  function renderImport() {
    var h = '<section class="hero"><h1>Importer des statistiques</h1>';
    h += '<p class="sub">Classements ou tableaux en CSV, Excel, PDF ou image. Un fichier peut ne contenir que la défense ou que l\'attaque : les joueurs sont complétés, jamais écrasés.</p>';
    h += '<div class="seg" role="group" aria-label="Type de classement">';
    [['auto', 'Auto'], ['def', 'DEF'], ['atk', 'ATK'], ['both', 'DEF + ATK']].forEach(function (o) {
      h += '<button class="segb' + (S.hintMode === o[0] ? ' on' : '') + '" data-act="hint" data-v="' + o[0] + '">' + o[1] + '</button>';
    });
    h += '</div><p class="muted small">« Auto » repère DEF ou ATK d\'après les titres ou le nom du fichier. Si ce n\'est pas clair, l\'application vous le demande.</p>';
    h += '<label class="btn primary big" for="file-input">' + ICONS.import + '<span>Choisir des fichiers</span></label>';
    h += '<input id="file-input" type="file" multiple accept=".csv,.tsv,.txt,.xlsx,.xls,.xlsm,.ods,.pdf,image/*" hidden>';
    h += '</section>';
    h += '<details class="card more"><summary>Coller du texte</summary><label class="field"><span>Un joueur par ligne, par exemple « Paul Dupont 82 »</span><textarea id="paste-text" rows="5" placeholder="1. Paul Dupont   82"></textarea></label><button class="btn" data-act="paste-go">Lire ce texte</button></details>';
    if (S.jobs.length) h += '<h2 class="sec">En cours</h2>' + S.jobs.map(renderJob).join('');
    h += '<h2 class="sec">Historique des imports</h2>';
    if (!S.db.imports.length) h += '<p class="muted">Aucun import pour l\'instant.</p>';
    else h += '<ul class="hist">' + S.db.imports.slice(0, 40).map(function (i) {
      return '<li><div><b>' + esc(i.name) + '</b><small>' + dateFr(i.date) + ' · ' + esc(i.kind || '') + (i.hint ? ' · ' + STAT_LABEL[i.hint] : '') + '</small></div><div class="hc">' +
        plural(i.rows, 'ligne', 'lignes') + '<small>' + i.created + ' nouveaux · ' + i.completed + ' complétés' + (i.updated ? ' · ' + i.updated + ' modifiés' : '') + (i.skipped ? ' · ' + i.skipped + ' ignorés' : '') + '</small></div></li>';
    }).join('') + '</ul>';
    return h;
  }

  function renderJob(job) {
    var h = '<article class="card job" data-job="' + job.id + '"><header class="jh"><div><b>' + esc(job.name) + '</b><small>' + esc(job.kind) + (job.hint ? ' · lu comme ' + STAT_LABEL[job.hint] : '') + '</small></div>' +
      '<button class="x" data-act="job-close" data-job="' + job.id + '" aria-label="Retirer">×</button></header>';
    if (job.status === 'reading') {
      return h + '<div class="busy inline"><div class="spin" aria-hidden="true"></div><span>' + esc(job.progress || 'Lecture en cours…') + '</span><button class="btn small ghost" data-act="job-stop" data-job="' + job.id + '">Arrêter</button></div></article>';
    }
    if (job.status === 'error') return h + '<p class="note bad">' + esc(job.err) + '</p></article>';
    (job.warnings || []).forEach(function (w) { h += '<p class="note warn small">' + esc(w) + '</p>'; });
    job.notes.slice(0, 6).forEach(function (n) { h += '<p class="muted small">' + esc(n) + '</p>'; });

    if (job.saved) {
      var s = job.saved;
      return h + '<p class="note ok">Enregistré : ' + plural(s.created, 'nouveau joueur', 'nouveaux joueurs') + ', ' + plural(s.completed, 'joueur complété', 'joueurs complétés') + (s.updated ? ', ' + plural(s.updated, 'valeur modifiée', 'valeurs modifiées') : '') + (s.unchanged ? ', ' + s.unchanged + ' déjà à jour' : '') + (s.skipped ? ', ' + s.skipped + ' ignoré' + (s.skipped > 1 ? 's' : '') : '') + '.</p></article>';
    }

    var hasUnk = job.rows.some(function (r) { return r.unk != null; });
    if (hasUnk) {
      return h + '<div class="note warn"><p><b>Ces chiffres sont-ils de la défense ou de l\'attaque ?</b> Le fichier ne le dit pas, et rien n\'est enregistré tant que vous n\'avez pas choisi.</p>' +
        '<div class="row gap"><button class="btn" data-act="unk" data-job="' + job.id + '" data-stat="def">C\'est la DÉFENSE</button><button class="btn" data-act="unk" data-job="' + job.id + '" data-stat="atk">C\'est l\'ATTAQUE</button></div></div></article>';
    }

    var rep = jobReport(job);
    h += '<div class="chips sum">' +
      '<span class="chip ok"><b>' + rep.created + '</b> nouveaux</span>' +
      '<span class="chip ok"><b>' + rep.completed + '</b> complétés</span>' +
      (rep.updated ? '<span class="chip warnc"><b>' + rep.updated + '</b> modifiés</span>' : '') +
      (rep.unchanged ? '<span class="chip"><b>' + rep.unchanged + '</b> déjà à jour</span>' : '') +
      (rep.toconfirm ? '<span class="chip warnc"><b>' + rep.toconfirm + '</b> à confirmer</span>' : '') +
      (rep.skipped ? '<span class="chip"><b>' + rep.skipped + '</b> ignorés</span>' : '') + '</div>';
    var nStatRows = { def: 0, atk: 0 };
    job.rows.forEach(function (r) { STATS.forEach(function (s) { if (r[s] != null) nStatRows[s]++; }); });
    h += '<p class="muted small">' + job.rows.length + ' lignes lues · DEF : ' + nStatRows.def + ' · ATK : ' + nStatRows.atk + '. Les statistiques absentes du fichier restent vides.</p>';

    var confirms = rep.items.filter(function (it) { return it.status === 'confirm'; });
    if (confirms.length) {
      h += '<div class="note warn"><p><b>À confirmer (' + confirms.length + ')</b> : le nom lu peut correspondre à plusieurs joueurs. Rien n\'est choisi au hasard.</p>';
      confirms.forEach(function (it) {
        var dec = job.decisions[it.i];
        h += '<div class="confirm"><div class="clabel">Lu : <b>' + esc(it.row.name) + '</b> ' + STATS.map(function (s) { return it.row[s] != null ? '<span class="chip ' + s + ' tiny">' + STAT_LABEL[s] + ' ' + fmt(it.row[s]) + '</span>' : ''; }).join('') + (it.row.unreadable ? ' <span class="badge warn">illisible</span>' : '') + '</div><div class="opts">';
        it.candidates.forEach(function (c) {
          var cp = S.db.players[c.id]; if (!cp) return;
          h += '<button class="opt' + (dec === c.id ? ' on' : '') + '" data-act="decide" data-job="' + job.id + '" data-i="' + it.i + '" data-v="' + esc(c.id) + '">' + esc(cp.name) + (cp.club ? ' · ' + esc(cp.club) : '') + ' <small>' + playerChipsText(cp) + '</small></button>';
        });
        h += '<button class="opt' + (dec === 'new' ? ' on' : '') + '" data-act="decide" data-job="' + job.id + '" data-i="' + it.i + '" data-v="new">Nouveau joueur</button>';
        h += '<button class="opt' + (dec === 'skip' ? ' on' : '') + '" data-act="decide" data-job="' + job.id + '" data-i="' + it.i + '" data-v="skip">Ignorer</button>';
        h += '</div></div>';
      });
      h += '</div>';
    }
    if (rep.conflicts.length) {
      h += '<div class="note warn"><p><b>Valeurs différentes de celles déjà enregistrées (' + rep.conflicts.length + ')</b> : la nouvelle valeur remplace l\'ancienne, sauf si vous gardez l\'ancienne.</p>';
      rep.conflicts.forEach(function (c) {
        h += '<div class="conf"><span>' + esc(c.name) + ' · ' + STAT_LABEL[c.stat] + ' ' + fmt(c.old) + ' → ' + fmt(c.now) + '</span><button class="btn small ' + (c.kept ? '' : 'ghost') + '" data-act="keep" data-job="' + job.id + '" data-i="' + c.i + '" data-stat="' + c.stat + '">' + (c.kept ? 'Ancienne gardée' : 'Garder ' + fmt(c.old)) + '</button></div>';
      });
      h += '</div>';
    }
    h += '<details class="more"><summary>Voir les ' + job.rows.length + ' lignes lues</summary><ul class="rows">' + rep.items.map(function (it) {
      var lbl = { created: 'nouveau', completed: 'complété', updated: 'modifié', unchanged: 'à jour', skipped: 'ignoré', toconfirm: 'à confirmer' }[it.result] || '';
      return '<li><span>' + esc(it.row.name) + '</span><span class="chips tiny">' + STATS.map(function (s) { return it.row[s] != null ? '<span class="chip ' + s + '">' + STAT_LABEL[s] + ' ' + fmt(it.row[s]) + '</span>' : ''; }).join('') + '<em>' + lbl + '</em></span></li>';
    }).join('') + '</ul></details>';
    var ready = rep.created + rep.completed + rep.updated + rep.unchanged;
    h += '<div class="row gap"><button class="btn primary big" data-act="job-save" data-job="' + job.id + '">Enregistrer dans la base</button></div>';
    if (rep.toconfirm) h += '<p class="muted small">Les ' + rep.toconfirm + ' joueur' + (rep.toconfirm > 1 ? 's' : '') + ' à confirmer seront ignorés si vous enregistrez maintenant.</p>';
    return h + '</article>';
  }
  function playerChipsText(p) {
    return STATS.map(function (s) { return STAT_LABEL[s] + ' ' + (p[s] == null ? '—' : fmt(p[s])); }).join(' · ');
  }

  /* ---------- Rendu : Joueurs ---------- */
  function filteredPlayers() {
    var q = C.normText(S.q), list = Object.keys(S.db.players).map(function (id) { return S.db.players[id]; });
    if (q) {

  function pickList(m) {

    }).join('') + '</ul>' + (list.length > 40 ? '<p class="muted small pad">Affinez la recherche pour voir les autres.</p>' : '');

  /* ---------- Rendu général ---------- */

    var el = $('#status'); if (!el) return;
    var txt = S.saving || S.saveErr || '';

    else if (S.tab === 'players') html = renderPlayers();
    else html = renderSettings();

    v.innerHTML = html;

  /* ---------- Actions ---------- */
  function closeModal() { S.modal = null; renderModal(); }
  function memberByKey(k) { return S.team.members.filter(function (m) { return String(m.key) === String(k); })[0]; }
  function nextKey() { return S.team.members.reduce(function (a, m) { return Math.max(a, m.key + 1); }, 0); }

  function exportBackup() {
    var data = JSON.stringify({ app: 'sorare-snatch-calculator', version: 1, date: new Date().toISOString(), players: S.db.players, imports: S.db.imports, rules: S.db.rules, floors: S.db.floors }, null, 1);
    var use = window.claude && window.claude.use ? window.claude.use('downloads') : Promise.resolve(null);
    use.catch(function () { return null; }).then(function (dl) {
      if (dl) return dl.save({ filename: 'sauvegarde-snatch-' + new Date().toISOString().slice(0, 10) + '.json', data: data });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' })); a.download = 'sauvegarde-snatch.json'; a.click();
    }).catch(function () { /* refusé par l'utilisateur */ });
  }

  function restoreBackup(file) {
    readText(file).then(function (t) {
      var d = JSON.parse(t);
      if (!d || typeof d.players !== 'object') throw new Error('Fichier de sauvegarde non reconnu.');
      var n = 0;
      Object.keys(d.players).forEach(function (id) { if (!S.db.players[id]) { S.db.players[id] = d.players[id]; n++; } });
      (d.imports || []).forEach(function (i) { if (!S.db.imports.some(function (x) { return x.id === i.id; })) S.db.imports.push(i); });
      S.db.imports.sort(function (a, b) { return a.date < b.date ? 1 : -1; });
      if (d.floors) STATS.forEach(function (st) { if (!S.db.floors[st] && d.floors[st]) S.db.floors[st] = d.floors[st]; });
      persist({ all: true, imports: true, rules: true });
      S.note = 'Sauvegarde restaurée : ' + n + ' joueur' + (n > 1 ? 's' : '') + ' ajouté' + (n > 1 ? 's' : '') + ' (les joueurs déjà présents sont conservés).';
      S.restoreMsg = S.note;
      renderTab();
    }).catch(function (e) { S.note = 'Restauration impossible : ' + e.message; renderTab(); });
  }

  function onClick(ev) {
    var el = ev.target.closest('[data-act],[data-tab]');
    if (!el) return;
    if (el.hasAttribute('data-tab')) { S.tab = el.getAttribute('data-tab'); renderTab(); window.scrollTo(0, 0); return; }
    var act = el.getAttribute('data-act'), d = el.dataset, m, job;
    switch (act) {
      case 'stop-shot': if (S.team.ctl) S.team.ctl.abort(); break;
      case 'rerun-shot': if (S.team.img && S.team.img.file) analyseScreenshot(S.team.img.file, true); break;
      case 'add-member':
        S.modal = { type: 'pick', title: 'Ajouter un joueur', q: '', target: 'add' }; renderModal(); break;
      case 'change-member':
        m = memberByKey(d.key); S.modal = { type: 'pick', title: 'Choisir le joueur', q: m ? m.name : '', target: d.key }; renderModal(); break;
      case 'rename-member':
        m = memberByKey(d.key); S.modal = { type: 'rename', key: d.key, value: m ? m.name : '' }; renderModal(); break;
      case 'remove-member':
        S.team.members = S.team.members.filter(function (x) { return String(x.key) !== String(d.key); }); renderTab(); break;
      case 'pick-cand':
        m = memberByKey(d.key); if (m) { m.id = d.id; m.status = 'manual'; } renderTab(); break;
      case 'toggle-seen':
        m = memberByKey(d.key); if (m) { m.useSeen = m.useSeen || {}; m.useSeen[d.stat] = !m.useSeen[d.stat]; } renderTab(); break;
      case 'skill':
        m = memberByKey(d.key); if (m) { m.skills = m.skills || {}; var nn = (m.skills[d.sk] || 0) + 1; m.skills[d.sk] = Math.min(9, nn); } renderTab(); break;
      case 'skill-minus':
        m = memberByKey(d.key); if (m && m.skills) { m.skills[d.sk] = Math.max(0, (m.skills[d.sk] || 0) - 1); } renderTab(); break;
      case 'skill-clear':
        m = memberByKey(d.key); if (m) { m.skills = {}; } renderTab(); break;
      case 'pick-do':
        if (S.modal && S.modal.type === 'pick') {
          if (S.modal.target === 'add') {
            var pl = S.db.players[d.id];
            S.team.members.push({ key: nextKey(), name: pl.name, pos: pl.pos, club: pl.club, seen: { def: null, atk: null }, unreadable: false, status: 'manual', id: pl.id, candidates: [] });
            if (S.team.state === 'idle' || S.team.state === 'error') { S.team.state = 'done'; S.team.err = ''; }
          } else { m = memberByKey(S.modal.target); if (m) { m.id = d.id; m.status = 'manual'; } }
        }
        closeModal(); renderTab(); break;
      case 'rename-ok':
        var val = ($('#rn') || {}).value || '';
        m = memberByKey(S.modal.key);
        if (m && val.trim()) {
          var mm = C.matchTeam(S.db.players, [{ name: val.trim(), club: m.club }])[0];
          m.name = val.trim(); m.unreadable = false; m.status = mm.status; m.id = mm.status === 'exact' ? mm.id : null; m.candidates = mm.candidates;
        }
        closeModal(); renderTab(); break;
      case 'modal-close': closeModal(); break;
      case 'hint': S.hintMode = d.v; renderTab(); break;
      case 'paste-go':
        var txt = ($('#paste-text') || {}).value || '';
        if (txt.trim()) startImport([new File([txt], 'texte collé.txt', { type: 'text/plain' })]);
        break;
      case 'job-close': S.jobs = S.jobs.filter(function (j) { if (j.id === d.job && j.ctl) j.ctl.abort(); return j.id !== d.job; }); renderTab(); break;
      case 'job-stop': job = S.jobs.filter(function (j) { return j.id === d.job; })[0]; if (job && job.ctl) job.ctl.abort(); break;
      case 'unk':
        job = S.jobs.filter(function (j) { return j.id === d.job; })[0]; if (job) { C.resolveUnknown(job.rows, d.stat); job.hint = d.stat; } renderTab(); break;
      case 'decide':
        job = S.jobs.filter(function (j) { return j.id === d.job; })[0];
        if (job) { if (job.decisions[d.i] === d.v) delete job.decisions[d.i]; else job.decisions[d.i] = d.v; }
        renderTab(); break;
      case 'keep':
        job = S.jobs.filter(function (j) { return j.id === d.job; })[0];
        if (job) { var kk = d.i + ':' + d.stat; if (job.keepOld[kk]) delete job.keepOld[kk]; else job.keepOld[kk] = true; }
        renderTab(); break;
      case 'job-save': job = S.jobs.filter(function (j) { return j.id === d.job; })[0]; if (job) saveJob(job); break;
      case 'filter': S.filter = d.v; S.limit = 60; renderTab(); break;
      case 'more-players': S.limit += 100; $('#plist').innerHTML = renderPlayerList(); break;
      case 'edit-player': S.modal = { type: 'edit', player: C.clonePlayer(S.db.players[d.id]), isNew: false }; renderModal(); break;
      case 'new-player': S.modal = { type: 'edit', player: { id: C.randomId(CHUNKS), name: '', pos: null, club: null, def: null, atk: null, src: {}, hist: [] }, isNew: true }; renderModal(); break;
      case 'edit-save': saveEdit(); break;
      case 'edit-del': S.modal.confirmDel = true; renderModal(); break;
      case 'edit-del-no': S.modal.confirmDel = false; renderModal(); break;
      case 'edit-del-do':
        var did = S.modal.player.id, cs = {}; cs[chunkOf(did)] = 1;
        delete S.db.players[did]; persist({ chunks: cs }); closeModal(); renderTab(); break;
      case 'dups': S.dup = C.findDuplicates(S.db.players); renderTab(); break;
      case 'dups-close': S.dup = null; renderTab(); break;
      case 'merge':
        var g = S.dup[+d.g]; if (!g) break;
        var keep = S.db.players[g[0]], cs2 = {}; cs2[chunkOf(g[0])] = 1;
        g.slice(1).forEach(function (id) { keep = C.mergePlayers(keep, S.db.players[id]); cs2[chunkOf(id)] = 1; delete S.db.players[id]; });
        S.db.players[g[0]] = keep; persist({ chunks: cs2 });
        S.dup = C.findDuplicates(S.db.players); renderTab(); break;
      case 'save-rules': {
        var mp = numOrNull($('#r-main').value), sp = numOrNull($('#r-sup').value);
        if (mp == null || sp == null || mp < 0 || sp < 0) { S.note = 'Entrez des pourcentages valides.'; break; }
        S.db.rules = { mainPct: mp, supportPct: sp, rounding: $('#r-round').value };
        persist({ rules: true }); S.note = ''; renderTab(); toast('Règle enregistrée'); break;
      }
      case 'reset-rules': S.db.rules = Object.assign({}, C.DEFAULT_RULES); persist({ rules: true }); renderTab(); toast('Règle remise à 100 % / 25 %'); break;
      case 'export': exportBackup(); break;
      case 'reset-ask': S.confirmReset = true; renderTab(); break;
      case 'reset-no': S.confirmReset = false; renderTab(); break;
      case 'reset-do':
        S.db.players = {}; S.db.imports = []; S.db.floors = { def: null, atk: null }; S.confirmReset = false; S.team.members = [];
        persist({ all: true, imports: true }).then(function () {
          if (dbh) { var seq = Promise.resolve(); for (var i = 0; i < CHUNKS; i++) (function (c) { seq = seq.then(function () { return dbh.doc('p/c' + (c < 10 ? '0' : '') + c).delete(); }); })(i); return seq; }
        }).catch(function () { /* ignore */ });
        renderTab(); toast('Base effacée'); break;
    }
  }

  function saveEdit() {
    var m = S.modal, p = m.player;
    var name = $('#e-name').value.trim();
    if (!name) { toast('Entrez un nom'); return; }
    var def = numOrNull($('#e-def').value), atk = numOrNull($('#e-atk').value);
    var date = new Date().toISOString();
    if (!p.hist) p.hist = []; if (!p.src) p.src = {};
    if (!m.isNew) {
      var old = S.db.players[p.id];
      [['def', def], ['atk', atk]].forEach(function (x) {
        if (old[x[0]] !== x[1]) { p.hist.push({ stat: x[0], old: old[x[0]], now: x[1], date: date, src: 'correction manuelle' }); p.src[x[0]] = x[1] == null ? '' : 'saisie manuelle'; }
      });
    } else {
      if (def != null) p.src.def = 'saisie manuelle'; if (atk != null) p.src.atk = 'saisie manuelle';
      p.created = date;
    }
    p.name = name; p.pos = $('#e-pos').value.trim() || null; p.club = $('#e-club').value.trim() || null; p.def = def; p.atk = atk; p.updated = date;
    S.db.players[p.id] = p;
    var cs = {}; cs[chunkOf(p.id)] = 1; persist({ chunks: cs });
    closeModal(); renderTab(); toast('Joueur enregistré');
  }

  var toastTimer = null;

    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 2200);
  }

  function onInput(ev) {
    var el = ev.target;
    if (el.id === 'q') { S.q = el.value; S.limit = 60; $('#plist').innerHTML = renderPlayerList(); return; }
    if (el.id === 'pick-q' && S.modal) { S.modal.q = el.value; $('#pick-list').innerHTML = pickList(S.modal); return; }
    if (el.getAttribute('data-field') === 'bonus') {
      S.bonus[el.getAttribute('data-name')] = el.value;
      var r = $('#results'); if (r) r.innerHTML = renderResults();
    }
  }
  function onChange(ev) {
    var el = ev.target;
    if (el.id === 'shot-input' && el.files && el.files[0]) { analyseScreenshot(el.files[0], false); el.value = ''; }
    else if (el.id === 'file-input' && el.files && el.files.length) { startImport(Array.prototype.slice.call(el.files)); el.value = ''; }
    else if (el.id === 'backup-input' && el.files && el.files[0]) { restoreBackup(el.files[0]); el.value = ''; }
    else if (el.getAttribute('data-field') === 'main') {
      var k = el.getAttribute('data-key');
      if (el.checked) delete S.mainsOff[k]; else S.mainsOff[k] = true;
      var r = $('#results'); if (r) r.innerHTML = renderResults();
    }
  }

  /* ---------- Démarrage ---------- */
  function boot() {
    document.addEventListener('click', onClick);
    document.addEventListener('input', onInput);
    document.addEventListener('change', onChange);
    renderTab();
    initStorage().then(function () { S.ready = true; renderTab(); }).catch(function () { S.ready = true; renderTab(); });
  }
  window.SnatchApp = { readCardSkills: readCardSkills, skSlots: skSlots, findCardStrips: findCardStrips, completeGrid: completeGrid, tagCanvas: tagCanvas, bitmapCanvas: bitmapCanvas, S: S, C: C, startImport: startImport, saveJob: saveJob, jobReport: jobReport, renderTab: renderTab, analyseScreenshot: analyseScreenshot, teamCalc: teamCalc, effStats: effStats, boot: boot };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
</body></html>
