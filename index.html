<title>Calculateur</title>
<style>
/* Terrain : fond craie à reflet vert, vert pelouse en accent, bleu acier = DEF, vermillon = ATK, ambre = donnée manquante */
:root {
  --bg: #f7f8f7; --surface: #ffffff; --surface2: #f1f4f1; --ink: #14201a; --muted: #5a6a61; --line: #d6ded7;
  --accent: #0e6b49; --accent-ink: #ffffff; --accent-soft: #dcefe6;
  --def: #1b5fa6; --def-soft: #e0ecf8; --atk: #bf3f10; --atk-soft: #fbe6dc;
  --warn: #8a5100; --warn-soft: #fdf0d3; --warn-line: #e9c777;
  --bad: #b3261e; --bad-soft: #fbe4e1; --ok: #0e6b49; --ok-soft: #dcefe6;
  --shadow: 0 1px 2px rgba(20, 32, 26, .06), 0 4px 14px rgba(20, 32, 26, .05);
  --f-body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-num: 'Barlow Condensed', 'Barlow', system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #080b0a; --surface: #121816; --surface2: #181f1c; --ink: #e5eee8; --muted: #94a69b; --line: #26382d;
    --accent: #48c18c; --accent-ink: #06130d; --accent-soft: #17382a;
    --def: #7db4ee; --def-soft: #16304b; --atk: #ff9a6e; --atk-soft: #4a2415;
    --warn: #f0c36a; --warn-soft: #382b10; --warn-line: #6b5420;
    --bad: #ff8f86; --bad-soft: #3d1a17; --ok: #48c18c; --ok-soft: #17382a;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #080b0a; --surface: #121816; --surface2: #181f1c; --ink: #e5eee8; --muted: #94a69b; --line: #26382d;
  --accent: #48c18c; --accent-ink: #06130d; --accent-soft: #17382a;
  --def: #7db4ee; --def-soft: #16304b; --atk: #ff9a6e; --atk-soft: #4a2415;
  --warn: #f0c36a; --warn-soft: #382b10; --warn-line: #6b5420;
  --bad: #ff8f86; --bad-soft: #3d1a17; --ok: #48c18c; --ok-soft: #17382a;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.4;
  padding-inline: 16px; padding-block: 0 112px; margin: 0 auto; max-width: 640px;
  background-image: repeating-linear-gradient(180deg, transparent 0 96px, rgba(14, 107, 73, .04) 96px 192px);
  -webkit-tap-highlight-color: transparent;
}
h1, h2, h3, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
small { font-size: 13px; color: var(--muted); }
b { font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.pad { padding: 14px 4px; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.hero { display: flex; flex-direction: column; gap: 12px; padding-block: 10px 6px; }
.hero h1 { font-family: var(--f-num); font-size: 34px; line-height: 1.05; font-weight: 700; text-wrap: balance; }
.hero .sub { color: var(--muted); font-size: 16px; }
.sec { border-left: 5px solid var(--accent); padding-left: 10px; font-family: var(--f-num); font-size: 22px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; margin-block: 22px 10px; }
.sec.in { margin-block: 0 8px; }

/* Boutons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; padding: 12px 18px;
  border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
  font-weight: 600; font-size: 17px; cursor: pointer; text-align: center; box-shadow: var(--shadow); user-select: none;
}
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.big { min-height: 64px; font-size: 19px; width: 100%; }
.btn.big svg { width: 26px; height: 26px; flex: none; }
.btn.small { min-height: 44px; padding: 8px 14px; font-size: 15px; }
.btn.ghost { background: transparent; box-shadow: none; }
.btn.danger { border-color: var(--bad); color: var(--bad); background: transparent; box-shadow: none; }
.btn.ghostd { margin-top: 10px; width: 100%; }

  /* Coupe une image très haute en tranches qui se chevauchent, pour garder les petits caractères lisibles. */
  function sliceImage(file, maxRatio) {
    return loadBitmap(file).then(function (bmp) {
      var w = bmp.width, h = bmp.height;
      if (h / w <= maxRatio) return [file];

      spans.forEach(function (sp) {

    });
  }

  function readPdf(file, job, mode, hint) {

            chain = chain.then(function () { return pdf.getPage(pn); }).then(function (pg) {
              var vp0 = pg.getViewport({ scale: 1 }), scale = Math.min(2.5, 1300 / vp0.width);
              var vp = pg.getViewport({ scale: scale }), cv = document.createElement('canvas');
              cv.width = vp.width; cv.height = vp.height;
              return pg.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise.then(function () { return canvasBlob(cv); });
            }).then(function (b) { blobs.push(b); });
          })(p);

  function readExcel(file, job, mode, hint) {
    var url = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    return (window.XLSX ? Promise.resolve() : loadScript(url)).then(function () { return file.arrayBuffer(); }).then(function (buf) {
      var wb = window.XLSX.read(buf, { type: 'array' });
      var rows = [];
      wb.SheetNames.forEach(function (sn) {
        var data = window.XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, raw: true, defval: null });
        var h = hint || C.detectHint(sn);
        var p = C.parseTable(data, h);
        if (p.rows.length) job.notes.push('Feuille « ' + sn + ' » : ' + plural(p.rows.length, 'joueur', 'joueurs') + (h ? ' (' + STAT_LABEL[h] + ')' : '') + '.');
        p.notes.forEach(function (n) { job.notes.push(n); });
        rows = rows.concat(p.rows);
      });
      return rows;
    });
  }

  function readJob(job, file) {
    var ext = (file.name.split('.').pop() || '').toLowerCase();
    var mode = job.mode;
    var hint = mode === 'def' || mode === 'atk' ? mode : (mode === 'both' ? null : C.detectHint(file.name));
    job.hint = hint;
    var p;
    if (['xlsx', 'xlsm', 'xls', 'ods'].indexOf(ext) >= 0) { job.kind = 'Excel'; p = readExcel(file, job, mode, hint); }
    else if (ext === 'pdf') { job.kind = 'PDF'; p = readPdf(file, job, mode, hint); }
    else if (file.type.indexOf('image/') === 0 || ['png', 'jpg', 'jpeg', 'webp', 'gif', 'heic', 'heif'].indexOf(ext) >= 0) {
      job.kind = 'Image';
      if (LOCAL) {
        p = ocrImageToText(file, job).then(function (t) {
          var r = C.parseText(t, hint);
          r.notes.forEach(function (n) { job.notes.push(n); });
          (r.warnings || []).forEach(function (w) { job.warnings.push(w); });
          if (r.rows.length) job.warnings.push('Image lue par reconnaissance de texte sur l\'appareil : relisez les noms et les chiffres avant d\'enregistrer. Un PDF, un Excel ou un CSV est toujours plus fiable.');
          return r.rows;
        });
        return p;
      }
      if (!imagesOK()) return Promise.reject(new Error(noImagesMsg()));
      p = sliceImage(file, 1.7).then(function (blobs) {
        if (blobs.length > 1) job.notes.push('Image haute découpée en ' + blobs.length + ' parties pour une meilleure lecture.');
        return aiStatsFromImages(blobs, mode, hint, job.ctl);
      });
    } else if (ext === 'csv' || ext === 'tsv') {
      job.kind = 'CSV';
      p = readText(file).then(function (t) {
        var r = C.parseTable(C.parseCSV(t), hint);
        if (!r.rows.length) r = C.parseText(t, hint);
        r.notes.forEach(function (n) { job.notes.push(n); });
        return r.rows;
      });
    } else if (ext === 'txt' || file.type.indexOf('text/') === 0) {
      job.kind = 'Texte';
      p = readText(file).then(function (t) { var r = C.parseText(t, hint); r.notes.forEach(function (n) { job.notes.push(n); }); (r.warnings || []).forEach(function (w) { job.warnings.push(w); }); return r.rows; });
    } else {
      return Promise.reject(new Error('Format non pris en charge (' + (ext || file.type || 'inconnu') + '). Utilisez CSV, Excel, PDF ou une image.'));
    }
    return p;
  }

  function startImport(files) {
    files.forEach(function (file) {
      var job = { id: uid(), name: file.name, kind: '', status: 'reading', rows: [], notes: [], warnings: [], err: '', mode: S.hintMode, hint: null,
        decisions: {}, keepOld: {}, saved: null, ctl: new AbortController() };
      S.jobs.unshift(job);
      renderTab();
      readJob(job, file).then(function (rows) {
        job.rows = rows || [];
        if (!job.rows.length) { job.status = 'error'; job.err = 'Aucun joueur lisible dans ce fichier.'; }
        else job.status = 'ready';
      }).catch(function (e) {
        job.status = 'error';
        job.err = e && e.code ? aiErrorText(e) : (e && e.message ? e.message : 'Lecture impossible.');
      }).then(function () { renderTab(); });
    });
  }

  function jobReport(job) {
    return C.applyImport(S.db.players, job.rows, job.decisions, job.keepOld, { file: job.name, chunks: CHUNKS });
  }

  function saveJob(job) {
    var rep = jobReport(job);
    var chunks = {};
    Object.keys(rep.players).forEach(function (id) { S.db.players[id] = rep.players[id]; chunks[chunkOf(id)] = 1; });
    var entry = {
      id: uid(), date: new Date().toISOString(), name: job.name, kind: job.kind, rows: job.rows.length,
      created: rep.created, completed: rep.completed, updated: rep.updated, unchanged: rep.unchanged,
      skipped: rep.skipped + rep.toconfirm, hint: job.hint || null
    };
    var fl = C.rankingFloor(job.rows, 50), flChanged = false;
    STATS.forEach(function (st) {
      if (fl[st] != null) { S.db.floors[st] = { value: fl[st], date: entry.date, file: job.name }; entry.floor = (entry.floor || '') + STAT_LABEL[st] + ' : 50e = ' + fmt(fl[st]) + ' '; flChanged = true; }
    });
    S.db.imports.unshift(entry);
    job.saved = entry;
    persist({ chunks: chunks, imports: true, rules: flChanged });
    renderTab();
  }

  function skTemplates() {
    if (skBits) return skBits;
    skBits = {};
    Object.keys(SK_TPL).forEach(function (k) {
      var h = SK_TPL[k], a = new Uint8Array(576), n = 0;
      for (var i = 0; i < h.length; i++) { var v = parseInt(h[i], 16); for (var b = 3; b >= 0; b--) { a[i * 4 + (3 - b)] = (v >> b) & 1; n += (v >> b) & 1; } }
      skBits[k] = a;
    });
    return skBits;
  }

            });
          });
        });
      });
      return seq.then(function () {
        T.srcs = srcs; T.sks = sks; T.fds = fds; T.nCells = cells.length;
        if (grid.guessed) notes.push('La dernière ligne est partiellement cachée par le bandeau du bas : vérifiez qu\'il ne manque aucun joueur (bouton « Ajouter un joueur »).');
        return rows;
      });
    }).then(function (rows) {
      var rr = C.normalizeAiRows(rows, null);
      if (!rr.length) throw { code: 'x', message: 'Aucun nom lisible sur cette capture. Vérifiez que votre base contient des joueurs (onglet Importer), ou ajoutez-les à la main.' };
      T.members = C.matchTeam(S.db.players, rr);
      T.members.forEach(function (m, i) { if (T.srcs && T.srcs[i]) m.posSrc = T.srcs[i]; });
      var fondRead = 0, fondUnsure = [];
      T.members.forEach(function (m, i) {
        var fd = T.fds && T.fds[i];
        if (fd && fd.key) { m.fond = fd.key; m.fondAuto = true; fondRead++; if (fd.p < 0.45) fondUnsure.push(m.name); }
      });
      if (fondRead) notes.push('Le fond de chaque carte (chance de critique) est lu automatiquement sur ' + plural(fondRead, 'carte', 'cartes') + ' sur ' + T.members.length + ' : vérifiez-le, vous pouvez le corriger sur chaque carte.' + (fondUnsure.length ? ' Lecture incertaine : ' + fondUnsure.join(', ') + '.' : ''));
      if (fondRead < T.members.length) notes.push('Fond non lu sur ' + plural(T.members.length - fondRead, 'carte', 'cartes') + ' : choisissez-le à la main sur la carte.');
      var skUnsure = 0;
      T.members.forEach(function (m, i) {
        var sk = (T.sks && T.sks[i]) || [];
        m.skillsRead = sk;
        m.skills = {};
        sk.forEach(function (x) { if (C.SKILLS.some(function (k) { return k.key === x.key; })) m.skills[x.key] = (m.skills[x.key] || 0) + x.count; if (!x.sure) skUnsure++; });
      });
      if (skUnsure) notes.push('Le chiffre (x2, x3…) de ' + plural(skUnsure, 'compétence', 'compétences') + ' n\'a pas pu être lu : x1 appliqué, vérifiez-le sur la carte.');
      // étiquette illisible et équipe de 7 : l'ordre des cartes est gardien, 2 défenseurs, 2 milieux, 2 attaquants
      if (T.members.length === 7 && !T.profile) {
        var inferred = 0;
        T.members.forEach(function (m, i) {
          var p = m.id ? S.db.players[m.id] : null;
          if (!(p && p.pos) && !m.pos) { m.pos = SLOT_ORDER[i]; m.posSrc = 'ordre'; inferred++; }
        });
        if (inferred) notes.push('Poste non lu sur ' + plural(inferred, 'carte', 'cartes') + ' : déduit de l\'ordre habituel (gardien, 2 défenseurs, 2 milieux, 2 attaquants). Vérifiez-le.');
      }
      T.state = 'done'; T.notes = notes;
      if (!Object.keys(S.db.players).length) T.err = 'Votre base est vide : importez d\'abord vos fichiers pour que les noms soient reconnus.';
    }).catch(function (e) {
      if (e && e.code === 'cancelled') { T.state = 'idle'; T.err = 'Lecture arrêtée.'; }
      else { T.state = 'error'; T.err = e && e.code && e.code !== 'x' ? aiErrorText(e) : (e && e.message) || 'Lecture impossible.'; }
    }).then(function () { T.ctl = null; T.progress = ''; if (mine) saveMine(); renderTab(); });
  }

  function ocrImageToText(file, job) {
    return sliceImage(file, 1.7).then(function (blobs) {
      var out = [], seq = Promise.resolve();
      blobs.forEach(function (b, i) {
        seq = seq.then(function () {
          job.progress = 'Lecture de l\'image' + (blobs.length > 1 ? ' (partie ' + (i + 1) + '/' + blobs.length + ')' : '') + '…'; renderTab();
          return bitmapCanvas(b, 2400).then(ocrText).then(function (t) { out.push(t); });
        });
      });
      return seq.then(function () { job.progress = ''; return out.join('\n'); });
    });
  }

  function analyseScreenshot(file, refresh, mine) {
    if (LOCAL) { return analyseScreenshotLocal(file, mine); }
    if (!imagesOK()) {
      S.team = { state: 'error', members: [], err: noImagesMsg() + ' Vous pouvez aussi ajouter les joueurs à la main avec « Ajouter un joueur ».', img: null, ctl: null };
      renderTab(); return;
    }
    var ctl = new AbortController();
    if (S.team.img && S.team.img.url) { try { URL.revokeObjectURL(S.team.img.url); } catch (e) { /* ignore */ } }
    S.team = { state: 'reading', members: [], err: '', img: { url: URL.createObjectURL(file), name: file.name, file: file }, ctl: ctl };
    S.mainsOff = {};
    renderTab();
    sliceImage(file, 1.55).then(function (blobs) {
      var max = S.limits.images.maxCount || 4;
      if (blobs.length > max) blobs = blobs.slice(0, max);
      return S.sample.json(TEAM_PROMPT(blobs.length), { images: blobs, signal: ctl.signal, cache: refresh ? false : true });
    }).then(function (r) {
      var rows = C.normalizeAiRows(pickArray(r), null);
      if (!rows.length) throw { code: 'x', message: 'Aucun joueur détecté sur cette capture. Essayez une capture plus nette, ou ajoutez les joueurs à la main.' };
      S.team.members = C.matchTeam(S.db.players, rows);
      S.team.state = 'done';
    }).catch(function (e) {
      if (e && e.code === 'cancelled') { S.team.state = 'idle'; S.team.err = 'Lecture arrêtée.'; }
      else { S.team.state = 'error'; S.team.err = e && e.code && e.code !== 'x' ? aiErrorText(e) : (e && e.message) || 'Lecture impossible.'; }
    }).then(function () { S.team.ctl = null; renderTab(); });
  }

  function effStats(m) {
    var p = m.id ? S.db.players[m.id] : null;
    var out = { src: {} };
    STATS.forEach(function (s) {
      var dbv = p && p[s] != null ? p[s] : null, seen = m.seen && m.seen[s] != null ? m.seen[s] : null;
      var v = null, src = null;
      if (m.useSeen && m.useSeen[s] && seen != null) { v = seen; src = 'capture'; }
      else if (dbv != null) { v = dbv; src = 'base'; }
      else if (seen != null) { v = seen; src = 'capture'; }
      if (v == null && S.db.floors && S.db.floors[s]) { v = S.db.floors[s].value - 1; src = 'estimé'; }
      out[s] = v; out.src[s] = src;
      if (dbv != null && seen != null && dbv !== seen) { out.src[s + 'Diff'] = { db: dbv, seen: seen }; }
    });
    return out;
  }

  function teamCalc() {
    var members = S.team.members.map(function (m) {
      var e = effStats(m), p = m.id ? S.db.players[m.id] : null;
      return { critP: (function () { var mu = C.MUTATIONS.filter(function (k) { return k.key === m.fond; })[0]; return mu ? mu.crit / 100 : 0; })(), skills: m.skills || null, name: p ? p.name : m.name, pos: (p && p.pos) || m.pos || null, def: e.def, atk: e.atk, defEst: e.src.def === 'estimé', atkEst: e.src.atk === 'estimé' };
    });
    var mains = [];
    S.team.members.forEach(function (m, i) { if (!S.mainsOff[m.key]) mains.push(i); });
    if (!members.length) return null;
    var b = S.bonus;
    return {
      mains: mains,
      calc: mains.length ? C.calcTeam(members, {
        rules: S.db.rules, mains: mains, roles: true,
        bonus: { def: numOrNull(b.def), atk: numOrNull(b.atk) },
        club: { def: numOrNull(b.clubDef), atk: numOrNull(b.clubAtk) },
        crit: { def: numOrNull(b.critDef), atk: numOrNull(b.critAtk) }
      }) : null
    };
  }

    h += '<p class="muted small rule">Défense : le joueur principal est un défenseur. Attaque : le joueur principal est un attaquant. Les autres cartes comptent au taux support. Un joueur sans note (absent du classement) reçoit la note du 50e moins 1' +
      (S.db.floors.def || S.db.floors.atk ? ' (' + STATS.filter(function (x) { return S.db.floors[x]; }).map(function (x) { return STAT_LABEL[x] + ' ' + fmt(S.db.floors[x].value - 1); }).join(', ') + ')' : ' (importez le Top 50 pour l\'activer)') + '.</p>';
    if (r.calc.unknownPos && r.calc.unknownPos.length) h += '<p class="note warn small">Poste inconnu (compté comme support, ne peut pas être joueur principal) : ' + r.calc.unknownPos.map(esc).join(', ') + '. Renseignez son poste dans sa fiche.</p>';
    h += '<p class="muted small rule">Règle : principal ' + fmt(rules.mainPct) + ' %, chaque support ' + fmt(rules.supportPct) + ' %, ' +
      ({ ceil: 'arrondi à l\'entier supérieur', round: 'arrondi à l\'entier le plus proche', floor: 'arrondi à l\'entier inférieur', none: 'sans arrondi' }[rules.rounding]) + ' pour chaque support. ' +
      plural(r.calc.size, 'joueur', 'joueurs') + ' dans l\'équipe.</p>';
    h += renderCritPanel();
    STATS.forEach(function (s) { h += renderStatResult(s, r.calc[s]); });

  }

  function renderStatResult(s, res) {
    var L = STAT_LABEL[s];
    if (res.none) {
      return '<section class="card stat ' + s + '"><header class="shead"><h3>' + (s === 'def' ? 'Défense' : 'Attaque') + (OPP ? ' de mon équipe' : ' adverse') + '</h3><span class="big warn">—</span></header><p class="note warn">' +
        (res.none === 'no-source' ? 'Aucun ' + (s === 'def' ? 'défenseur' : 'attaquant') + ' identifié dans l\'équipe (poste manquant ?) : ' + L + ' non calculable. Renseignez le poste dans la fiche du joueur.' : 'Cochez au moins un ' + (s === 'def' ? 'défenseur' : 'attaquant') + ' qui peut être le joueur principal.') + '</p></section>';
    }
    var cands = res.candidates.slice().sort(function (a, b) {
      if (a.mainMissing !== b.mainMissing) return a.mainMissing ? 1 : -1;
      return b.total - a.total;
    });
    var h = '<section class="card stat ' + s + '"><header class="shead"><h3>' + (s === 'def' ? 'Défense' : 'Attaque') + (OPP ? ' de mon équipe' : ' adverse') + '</h3>';
    var headline;
    if (res.min == null) headline = '<span class="big warn">incomplet</span>';
    else if (res.min === res.max) headline = '<span class="big">' + fmt(res.min) + '</span>';
    else headline = '<span class="big">' + fmt(res.min) + ' <small>à</small> ' + fmt(res.max) + '</span>';
    h += headline + '</header>';
    var cexp = cands.filter(function (c) { return c.dist && !c.mainMissing; });
    if (cexp.length) {
      var emin = Math.min.apply(null, cexp.map(function (c) { return c.expTotal; })), emax = Math.max.apply(null, cexp.map(function (c) { return c.expTotal; })), mx = Math.max.apply(null, cexp.map(function (c) { return c.maxTotal; }));
      if (mx > res.max + 1e-9) h += '<p class="muted small">Avec les critiques (aléatoires) : en moyenne ' + (Math.abs(emin - emax) < 0.05 ? fmt(Math.round(emin * 10) / 10) : fmt(Math.round(emin * 10) / 10) + ' à ' + fmt(Math.round(emax * 10) / 10)) + ', jusqu\'à ' + fmt(mx) + ' si toutes les cartes critiquent.</p>';
    }
    var anyMissing = cands.some(function (c) { return !c.complete; });
    if (anyMissing) {
      var names = {};
      cands.forEach(function (c) { c.missingNames.forEach(function (n) { names[n] = 1; }); });
      h += '<p class="note warn">Statistique ' + L + ' manquante pour : ' + Object.keys(names).map(esc).join(', ') + '. Les totaux marqués « au moins » ne comptent pas ces joueurs.</p>';
    }
    h += '<div class="cl">';
    cands.forEach(function (c, i) {
      var open = i === 0 && cands.length <= 3 ? ' open' : '';
      var tot = c.mainMissing ? '<span class="tot warn">impossible</span>' : '<span class="tot">' + (c.complete ? '' : '<small>au moins </small>') + fmt(c.total) + '</span>';
      h += '<details class="cand"' + open + '><summary><span>Principal : <b>' + esc(c.mainName) + '</b></span>' + tot + '</summary>';
      if (c.mainMissing) h += '<p class="note warn small">' + esc(c.mainName) + ' n\'a pas de ' + L + ' connue : impossible de calculer ce cas.</p>';
      h += '<div class="tw"><table><thead><tr><th>Joueur</th><th>Base</th><th>Part</th></tr></thead><tbody>';
      c.lines.forEach(function (l) {
        var raw = l.base == null ? null : l.base * l.pct / 100;
        var part = l.contrib == null ? '<span class="warn">manquante</span>' :
          (Math.abs(raw - l.contrib) > 1e-9 ? fmt(raw) + ' → <b>' + fmt(l.contrib) + '</b>' : '<b>' + fmt(l.contrib) + '</b>');
        h += '<tr class="' + l.role + '"><td>' + esc(l.name) + '<small>' + (l.role === 'principal' ? 'principal' : 'support') + ' · ' + fmt(l.pct) + '\u00a0%' + (l.est ? ' · estimé (50e − 1)' : '') + '</small></td><td>' + (l.base == null ? '—' : fmt(l.base)) + '</td><td>' + part + '</td></tr>';
      });
      h += '</tbody><tfoot>';
      h += '<tr><td colspan="2">Sous-total</td><td>' + fmt(c.subtotal) + '</td></tr>';
      if (c.skills) h += '<tr><td colspan="2">Compétences</td><td>' + (c.skills > 0 ? '+ ' : '− ') + fmt(Math.abs(c.skills)) + '</td></tr>';
      h += '<tr><td colspan="2">Bonus ' + L + '</td><td>+ ' + fmt(c.bonus) + '</td></tr>';
      h += '<tr><td colspan="2">Bonus de club</td><td>' + (c.club == null ? '<span class="muted">non confirmé, pas ajouté</span>' : '+ ' + fmt(c.club)) + '</td></tr>';
      h += '<tr class="total"><td colspan="2">Total ' + L + (c.complete ? '' : ' (minimum)') + '</td><td>' + fmt(c.total) + '</td></tr>';
      if (c.critTotal != null) h += '<tr class="crit"><td colspan="2">Si critique (aléatoire, à part) : +' + fmt(c.crit) + '</td><td>' + fmt(c.critTotal) + '</td></tr>';
      h += '</tfoot></table></div></details>';
    });
    h += '</div></section>';
    return h;
  }


  /* ---------- Mon équipe (onglet Duel) ---------- */

  function pctTxt(x) { var p = Math.round(x * 100); if (x > 0 && p === 0) return '<1 %'; if (x < 1 && p === 100) return '>99 %'; return p + ' %'; }
  function duelCard(title, sub, odds, mode) {
    /* mode 'att' : chance de gagner ; mode 'def' : chance de résister. Les critiques de chaque carte sont inclus dans les probabilités. */
    var h = '<section class="card duel"><h3>' + esc(title) + '</h3><p class="muted small">' + sub + '</p>';
    if (!odds) return h + '<p class="note warn">Calcul impossible pour l\'instant : il faut au moins un joueur principal possible de chaque côté, avec ses statistiques connues.</p></section>';
    var win = odds.cwin, tie = odds.ctie, lose = odds.close;
    var good = mode === 'att' ? win : tie + lose;
    var cls = good >= 0.999 ? 'ok' : good <= 0.001 ? 'bad' : 'warn';
    var verdict = mode === 'att'
      ? (good >= 0.999 ? 'Victoire assurée' : good <= 0.001 ? 'Pas de victoire possible' : pctTxt(good) + ' de chances de gagner')
      : (good >= 0.999 ? 'Vous résistez à coup sûr' : good <= 0.001 ? 'Vous ne résistez dans aucun cas' : 'Vous résistez dans ' + pctTxt(good) + ' des cas');
    h += '<div class="verdict ' + cls + '">' + verdict + '</div>';
    var A = mode === 'att' ? [odds.attMin, odds.attMax] : [odds.defMin, odds.defMax];
    var B = mode === 'att' ? [odds.defMin, odds.defMax] : [odds.attMin, odds.attMax];
    function rg(x) { return x[0] === x[1] ? fmt(x[0]) : fmt(x[0]) + ' à ' + fmt(x[1]); }
    h += '<div class="vs"><div><small>' + (mode === 'att' ? 'Mon attaque' : 'Ma défense') + '</small><b>' + rg(A) + '</b></div><span>contre</span><div><small>' + (mode === 'att' ? 'Défense adverse' : 'Attaque adverse') + '</small><b>' + rg(B) + '</b></div></div>';
    h += '<p class="muted small">Critiques de chaque carte inclus, sur ' + plural(odds.pairs, 'combinaison possible', 'combinaisons possibles') + ' de joueurs principaux : ' + (mode === 'att' ? 'victoire ' + pctTxt(win) + ' · égalité ' + pctTxt(tie) + ' · défaite ' + pctTxt(lose) : 'son attaque passe ' + pctTxt(win) + ' · égalité ' + pctTxt(tie) + ' · ma défense tient ' + pctTxt(lose)) + '.</p>';
    var g0 = mode === 'att' ? odds.win : odds.tie + odds.lose;
    if (Math.abs(g0 - good) > 0.005) h += '<p class="muted small">Sans aucun critique : ' + pctTxt(g0) + (mode === 'att' ? ' de chances de gagner' : ' de résistance') + '.</p>';
    if (odds.incomplete) h += '<p class="note warn small">Certaines notes sont manquantes : les totaux sont des minimums, le résultat est donc approximatif.</p>';
    if (odds.rows.length <= 36) {
      h += '<details class="more"><summary>Voir tous les cas (sans critique)</summary><div class="tw"><table><thead><tr><th>' + (mode === 'att' ? 'Mon attaquant' : 'Attaquant adverse') + '</th><th>' + (mode === 'att' ? 'Leur défenseur' : 'Mon défenseur') + '</th><th>Résultat</th></tr></thead><tbody>';
      odds.rows.forEach(function (r) {
        var t = mode === 'att' ? (r.res === 'win' ? '✔ gagné' : r.res === 'tie' ? '= égalité' : '✘ perdu') : (r.res === 'win' ? '✘ percé' : r.res === 'tie' ? '= tenu' : '✔ tenu');
        h += '<tr class="' + r.res + '"><td>' + esc(r.att) + '<small>' + fmt(r.attTotal) + '</small></td><td>' + esc(r.def) + '<small>' + fmt(r.defTotal) + '</small></td><td>' + t + '</td></tr>';
      });
      h += '</tbody></table></div></details>';
    }
    return h + '</section>';
  }
  function duelVerdictHtml() {
    var opp = teamCalc();
    var mine = inMine(teamCalc);
    var h = '';
    if (!opp || !opp.calc) {
      return '<section class="card alert warn"><p>Il manque l\'équipe adverse : envoyez d\'abord sa capture dans l\'onglet « Analyser ».</p><button class="btn" data-tab="analyse">Aller à Analyser</button></section>';
    }
    if (!mine || !mine.calc) {
      return '<section class="card alert warn"><p>Ajoutez les joueurs de votre équipe ci-dessous (avec au moins un attaquant et un défenseur possibles comme joueur principal).</p></section>';
    }
    var cOpp = C.critChance(S.team.members), cMine = inMine(function () { return C.critChance(S.team.members); });
    h += '<section class="card duel"><h3>Critiques</h3><div class="vs"><div><small>Moi</small><b>' + fmt(Math.round(cMine.expected * 100) / 100) + '</b><small>en moyenne</small></div><span>contre</span><div><small>Adversaire</small><b>' + fmt(Math.round(cOpp.expected * 100) / 100) + '</b><small>en moyenne</small></div></div>' +
      '<p class="muted small">Chaque carte tire son critique au début du combat avec la chance de son fond (somme : moi ' + fmt(cMine.raw) + ' %, adversaire ' + fmt(cOpp.raw) + ' %) ; un critique multiplie seulement la note de cette carte par 1,25. Chance d\'au moins un critique : moi ' + fmt(Math.round(cMine.atLeastOne)) + ' %, adversaire ' + fmt(Math.round(cOpp.atLeastOne)) + ' %.' + (cMine.unknown || cOpp.unknown ? ' Fond non renseigné : ' + [cMine.unknown ? 'mon équipe ' + cMine.unknown : '', cOpp.unknown ? 'adversaire ' + cOpp.unknown : ''].filter(Boolean).join(', ') + ' carte(s) comptée(s) 0 %.' : '') + '</p></section>';
    h += duelCard('Quand j\'attaque', 'Mon attaque contre la défense de l\'adversaire. Il faut faire strictement plus pour gagner.', C.duelOdds(mine.calc.atk, opp.calc.def), 'att');
    h += duelCard('Quand l\'adversaire m\'attaque', 'Son attaque contre ma défense.', C.duelOdds(opp.calc.atk, mine.calc.def), 'def');
    return h;
  }
  function refreshDuel() {

  function renderDuel() {

      if (t.members.length && S.confirmMine) x += '<p class="note bad">Retirer tous les joueurs de votre équipe ?</p><div class="row gap"><button class="btn danger" data-act="mine-clear-do">Oui, vider</button><button class="btn ghost" data-act="mine-clear-no">Non</button></div>';
      if (t.members.length) {

      }

    });
    h += '</div>';
    return h;
  }

        plural(i.rows, 'ligne', 'lignes') + '<small>' + i.created + ' nouveaux · ' + i.completed + ' complétés' + (i.updated ? ' · ' + i.updated + ' modifiés' : '') + (i.skipped ? ' · ' + i.skipped + ' ignorés' : '') + '</small></div></li>';

  function renderJob(job) {
    var h = '<article class="card job" data-job="' + job.id + '"><header class="jh"><div><b>' + esc(job.name) + '</b><small>' + esc(job.kind) + (job.hint ? ' · lu comme ' + STAT_LABEL[job.hint] : '') + '</small></div>' +
      '<button class="x" data-act="job-close" data-job="' + job.id + '" aria-label="Retirer">×</button></header>';
    if (job.status === 'reading') {
      return h + '<div class="busy inline"><div class="spin" aria-hidden="true"></div><span>' + esc(job.progress || 'Lecture en cours…') + '</span><button class="btn small ghost" data-act="job-stop" data-job="' + job.id + '">Arrêter</button></div></article>';
    }
    if (job.status === 'error') return h + '<p class="note bad">' + esc(job.err) + '</p></article>';
    (job.warnings || []).forEach(function (w) { h += '<p class="note warn small">' + esc(w) + '</p>'; });
    job.notes.slice(0, 6).forEach(function (n) { h += '<p class="muted small">' + esc(n) + '</p>'; });

    if (job.saved) {
      var s = job.saved;
      return h + '<p class="note ok">Enregistré : ' + plural(s.created, 'nouveau joueur', 'nouveaux joueurs') + ', ' + plural(s.completed, 'joueur complété', 'joueurs complétés') + (s.updated ? ', ' + plural(s.updated, 'valeur modifiée', 'valeurs modifiées') : '') + (s.unchanged ? ', ' + s.unchanged + ' déjà à jour' : '') + (s.skipped ? ', ' + s.skipped + ' ignoré' + (s.skipped > 1 ? 's' : '') : '') + '.</p></article>';
    }

    var hasUnk = job.rows.some(function (r) { return r.unk != null; });
    if (hasUnk) {
      return h + '<div class="note warn"><p><b>Ces chiffres sont-ils de la défense ou de l\'attaque ?</b> Le fichier ne le dit pas, et rien n\'est enregistré tant que vous n\'avez pas choisi.</p>' +
        '<div class="row gap"><button class="btn" data-act="unk" data-job="' + job.id + '" data-stat="def">C\'est la DÉFENSE</button><button class="btn" data-act="unk" data-job="' + job.id + '" data-stat="atk">C\'est l\'ATTAQUE</button></div></div></article>';
    }

    var rep = jobReport(job);
    h += '<div class="chips sum">' +
      '<span class="chip ok"><b>' + rep.created + '</b> nouveaux</span>' +
      '<span class="chip ok"><b>' + rep.completed + '</b> complétés</span>' +
      (rep.updated ? '<span class="chip warnc"><b>' + rep.updated + '</b> modifiés</span>' : '') +
      (rep.unchanged ? '<span class="chip"><b>' + rep.unchanged + '</b> déjà à jour</span>' : '') +
      (rep.toconfirm ? '<span class="chip warnc"><b>' + rep.toconfirm + '</b> à confirmer</span>' : '') +
      (rep.skipped ? '<span class="chip"><b>' + rep.skipped + '</b> ignorés</span>' : '') + '</div>';
    var nStatRows = { def: 0, atk: 0 };
    job.rows.forEach(function (r) { STATS.forEach(function (s) { if (r[s] != null) nStatRows[s]++; }); });
    h += '<p class="muted small">' + job.rows.length + ' lignes lues · DEF : ' + nStatRows.def + ' · ATK : ' + nStatRows.atk + '. Les statistiques absentes du fichier restent vides.</p>';

    var confirms = rep.items.filter(function (it) { return it.status === 'confirm'; });
    if (confirms.length) {
      h += '<div class="note warn"><p><b>À confirmer (' + confirms.length + ')</b> : le nom lu peut correspondre à plusieurs joueurs. Rien n\'est choisi au hasard.</p>';
      confirms.forEach(function (it) {
        var dec = job.decisions[it.i];
        h += '<div class="confirm"><div class="clabel">Lu : <b>' + esc(it.row.name) + '</b> ' + STATS.map(function (s) { return it.row[s] != null ? '<span class="chip ' + s + ' tiny">' + STAT_LABEL[s] + ' ' + fmt(it.row[s]) + '</span>' : ''; }).join('') + (it.row.unreadable ? ' <span class="badge warn">illisible</span>' : '') + '</div><div class="opts">';
        it.candidates.forEach(function (c) {
          var cp = S.db.players[c.id]; if (!cp) return;
          h += '<button class="opt' + (dec === c.id ? ' on' : '') + '" data-act="decide" data-job="' + job.id + '" data-i="' + it.i + '" data-v="' + esc(c.id) + '">' + esc(cp.name) + (cp.club ? ' · ' + esc(cp.club) : '') + ' <small>' + playerChipsText(cp) + '</small></button>';
        });
        h += '<button class="opt' + (dec === 'new' ? ' on' : '') + '" data-act="decide" data-job="' + job.id + '" data-i="' + it.i + '" data-v="new">Nouveau joueur</button>';
        h += '<button class="opt' + (dec === 'skip' ? ' on' : '') + '" data-act="decide" data-job="' + job.id + '" data-i="' + it.i + '" data-v="skip">Ignorer</button>';
        h += '</div></div>';
      });
      h += '</div>';
    }
    if (rep.conflicts.length) {
      h += '<div class="note warn"><p><b>Valeurs différentes de celles déjà enregistrées (' + rep.conflicts.length + ')</b> : la nouvelle valeur remplace l\'ancienne, sauf si vous gardez l\'ancienne.</p>';
      rep.conflicts.forEach(function (c) {
        h += '<div class="conf"><span>' + esc(c.name) + ' · ' + STAT_LABEL[c.stat] + ' ' + fmt(c.old) + ' → ' + fmt(c.now) + '</span><button class="btn small ' + (c.kept ? '' : 'ghost') + '" data-act="keep" data-job="' + job.id + '" data-i="' + c.i + '" data-stat="' + c.stat + '">' + (c.kept ? 'Ancienne gardée' : 'Garder ' + fmt(c.old)) + '</button></div>';
      });
      h += '</div>';
    }
    h += '<details class="more"><summary>Voir les ' + job.rows.length + ' lignes lues</summary><ul class="rows">' + rep.items.map(function (it) {
      var lbl = { created: 'nouveau', completed: 'complété', updated: 'modifié', unchanged: 'à jour', skipped: 'ignoré', toconfirm: 'à confirmer' }[it.result] || '';
      return '<li><span>' + esc(it.row.name) + '</span><span class="chips tiny">' + STATS.map(function (s) { return it.row[s] != null ? '<span class="chip ' + s + '">' + STAT_LABEL[s] + ' ' + fmt(it.row[s]) + '</span>' : ''; }).join('') + '<em>' + lbl + '</em></span></li>';
    }).join('') + '</ul></details>';
    var ready = rep.created + rep.completed + rep.updated + rep.unchanged;
    h += '<div class="row gap"><button class="btn primary big" data-act="job-save" data-job="' + job.id + '">Enregistrer dans la base</button></div>';
    if (rep.toconfirm) h += '<p class="muted small">Les ' + rep.toconfirm + ' joueur' + (rep.toconfirm > 1 ? 's' : '') + ' à confirmer seront ignorés si vous enregistrez maintenant.</p>';
    return h + '</article>';
  }
  function playerChipsText(p) {
    return STATS.map(function (s) { return STAT_LABEL[s] + ' ' + (p[s] == null ? '—' : fmt(p[s])); }).join(' · ');

  /* ---------- Rendu : Joueurs ---------- */
  function filteredPlayers() {
    var q = C.normText(S.q), list = Object.keys(S.db.players).map(function (id) { return S.db.players[id]; });

      var qt = q.split(' ');

    list.sort(function (a, b) { return C.normText(a.name) < C.normText(b.name) ? -1 : 1; });

  }

  /* ---------- Thème (clair / sombre / auto) ---------- */

    h += '<div class="row gap"><button class="btn" data-act="export">Exporter la base (fichier)</button><label class="btn ghost" for="backup-input">Restaurer une sauvegarde</label><input id="backup-input" type="file" accept=".json,application/json" hidden></div></section>';

    else h += '<p class="note bad">Tous les joueurs et l\'historique seront supprimés. Cette action est définitive.</p><div class="row gap"><button class="btn danger" data-act="reset-do">Oui, tout effacer</button><button class="btn ghost" data-act="reset-no">Annuler</button></div>';

      if (p.hist && p.hist.length) h += '<details class="more"><summary>Historique des changements</summary><ul class="rows">' + p.hist.slice().reverse().map(function (x) { return '<li><span>' + STAT_LABEL[x.stat] + ' ' + fmt(x.old) + ' → ' + fmt(x.now) + '</span><em>' + dateFr(x.date) + '</em></li>'; }).join('') + '</ul></details>';

      if (!m.isNew) h += m.confirmDel ? '<p class="note bad">Supprimer ce joueur de la base ?</p><div class="row gap"><button class="btn danger" data-act="edit-del-do">Oui, supprimer</button><button class="btn ghost" data-act="edit-del-no">Non</button></div>' : '<button class="btn danger ghostd" data-act="edit-del">Supprimer ce joueur</button>';

  function pickList(m) {
    var q = C.normText(m.q || ''), qt = q ? q.split(' ') : [];
    var list = Object.keys(S.db.players).map(function (id) { return S.db.players[id]; });
    if (qt.length) list = list.filter(function (p) { var n = C.normText(p.name + ' ' + (p.club || '')); return qt.every(function (t) { return n.indexOf(t) >= 0; }); });
    list.sort(function (a, b) { return C.normText(a.name) < C.normText(b.name) ? -1 : 1; });
    var fuzzy = false;
    if (!list.length && qt.length) {
      var top = C.matchOcrName(S.db.players, [m.q]).top.filter(function (x) { return x.score >= 0.55; });
      list = top.map(function (x) { return S.db.players[x.id]; });
      fuzzy = list.length > 0;
    }
    if (!list.length) return '<p class="muted pad">Aucun joueur trouvé dans la base. S\'il n\'est dans aucun classement importé, ses notes sont estimées (50e − 1).</p>';
    return (fuzzy ? '<p class="muted small pad">Aucun nom exact : voici les plus proches.</p>' : '') + '<ul class="plist">' + list.slice(0, 40).map(function (p) {
      return '<li><button class="prow" data-act="pick-do" data-id="' + esc(p.id) + '"><span class="pn"><b>' + esc(p.name) + '</b><small>' + [p.pos, p.club].filter(Boolean).map(esc).join(' · ') + '</small></span><span class="chips tiny">' + playerChips(p) + '</span></button></li>';
    }).join('') + '</ul>' + (list.length > 40 ? '<p class="muted small pad">Affinez la recherche pour voir les autres.</p>' : '');
  }

  /* ---------- Rendu général ---------- */
  function renderStatus() {
    var el = $('#status'); if (!el) return;
    var txt = S.saving || S.saveErr || '';
    el.textContent = txt; el.className = 'status' + (S.saveErr ? ' bad' : '');
  }
  function renderTab() {
    if (OPP) { S.needRender = true; return; }
    var v = $('#view'); if (!v) return;
    var y = window.scrollY;
    var html = '';

    else if (S.tab === 'analyse') html = renderAnalyse();
    else if (S.tab === 'duel') html = renderDuel();
    else if (S.tab === 'import') html = renderImport();
    else if (S.tab === 'players') html = renderPlayers();
    else html = renderSettings();

  /* ---------- Actions ---------- */
  function closeModal() { S.modal = null; renderModal(); }
  function memberByKey(k) { return S.team.members.filter(function (m) { return String(m.key) === String(k); })[0]; }
  function nextKey() { return S.team.members.reduce(function (a, m) { return Math.max(a, m.key + 1); }, 0); }

  function exportBackup() {
    var data = JSON.stringify({ app: 'sorare-snatch-calculator', version: 1, date: new Date().toISOString(), players: S.db.players, imports: S.db.imports, rules: S.db.rules, floors: S.db.floors, mine: mineSnapshot(), analysis: oppSnapshot() }, null, 1);
    var use = window.claude && window.claude.use ? window.claude.use('downloads') : Promise.resolve(null);
    use.catch(function () { return null; }).then(function (dl) {
      if (dl) return dl.save({ filename: 'sauvegarde-snatch-' + new Date().toISOString().slice(0, 10) + '.json', data: data });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' })); a.download = 'sauvegarde-snatch.json'; a.click();
    }).catch(function () { /* refusé par l'utilisateur */ });
  }

  function restoreBackup(file) {
    readText(file).then(function (t) {
      var d = JSON.parse(t);
      if (!d || typeof d.players !== 'object') throw new Error('Fichier de sauvegarde non reconnu.');
      var n = 0;
      Object.keys(d.players).forEach(function (id) { if (!S.db.players[id]) { S.db.players[id] = d.players[id]; n++; } });
      (d.imports || []).forEach(function (i) { if (!S.db.imports.some(function (x) { return x.id === i.id; })) S.db.imports.push(i); });
      S.db.imports.sort(function (a, b) { return a.date < b.date ? 1 : -1; });
      if (d.floors) STATS.forEach(function (st) { if (!S.db.floors[st] && d.floors[st]) S.db.floors[st] = d.floors[st]; });
      if (d.mine && !S.mine.team.members.length) { applyMine(d.mine); saveMine(); }
      if (d.analysis && !S.team.members.length) { applyOpp(d.analysis); saveOpp(); }
      persist({ all: true, imports: true, rules: true });
      S.note = 'Sauvegarde restaurée : ' + n + ' joueur' + (n > 1 ? 's' : '') + ' ajouté' + (n > 1 ? 's' : '') + ' (les joueurs déjà présents sont conservés).';
      S.restoreMsg = S.note;
      renderTab();
    }).catch(function (e) { S.note = 'Restauration impossible : ' + e.message; renderTab(); });
  }

  function onClick(ev) {
    var el = ev.target.closest('[data-act],[data-tab]');
    if (!el) return;
    if (el.hasAttribute('data-tab')) { S.tab = el.getAttribute('data-tab'); renderTab(); window.scrollTo(0, 0); return; }
    if (isMineEl(el)) {
      enterMine();
      try { handleAct(el); if (S.modal && !S.modal.ctx) S.modal.ctx = 'mine'; } finally { leaveMine(); }
      saveMine(); S.needRender = false; renderTab(); renderModal(); return;
    }
    handleAct(el);
  }
  function handleAct(el) {
    var act = el.getAttribute('data-act'), d = el.dataset, m, job;
    switch (act) {
      case 'stop-shot': if (S.team.ctl) S.team.ctl.abort(); break;
      case 'rerun-shot': if (S.team.img && S.team.img.file) analyseScreenshot(S.team.img.file, true, !!OPP); break;
      case 'add-member':
        S.modal = { type: 'pick', title: 'Ajouter un joueur', q: '', target: 'add' }; renderModal(); break;
      case 'change-member':
        m = memberByKey(d.key); S.modal = { type: 'pick', title: 'Choisir le joueur', q: m ? m.name : '', target: d.key }; renderModal(); break;
      case 'rename-member':
        m = memberByKey(d.key); S.modal = { type: 'rename', key: d.key, value: m ? m.name : '' }; renderModal(); break;
      case 'remove-member':
        S.team.members = S.team.members.filter(function (x) { return String(x.key) !== String(d.key); }); renderTab(); break;
      case 'pick-cand':
        m = memberByKey(d.key); if (m) { m.id = d.id; m.status = 'manual'; } renderTab(); break;
      case 'toggle-seen':
        m = memberByKey(d.key); if (m) { m.useSeen = m.useSeen || {}; m.useSeen[d.stat] = !m.useSeen[d.stat]; } renderTab(); break;
      case 'skill':
        m = memberByKey(d.key); if (m) { m.skills = m.skills || {}; var nn = (m.skills[d.sk] || 0) + 1; m.skills[d.sk] = Math.min(9, nn); } renderTab(); break;
      case 'skill-minus':
        m = memberByKey(d.key); if (m && m.skills) { m.skills[d.sk] = Math.max(0, (m.skills[d.sk] || 0) - 1); } renderTab(); break;
      case 'fond':
        m = memberByKey(d.key); if (m) { m.fond = m.fond === d.fd ? null : d.fd; m.fondAuto = false; } renderTab(); break;
      case 'skill-clear':
        m = memberByKey(d.key); if (m) { m.skills = {}; } renderTab(); break;
      case 'mine-clear':
        S.confirmMine = true; renderTab(); break;
      case 'mine-clear-no':
        S.confirmMine = false; renderTab(); break;
      case 'mine-clear-do':
        S.team = { state: 'idle', members: [], err: '', img: null, ctl: null }; S.mainsOff = {}; S.confirmMine = false; renderTab(); break;
      case 'opp-clear':
        S.confirmOpp = true; renderTab(); break;
      case 'opp-clear-no':
        S.confirmOpp = false; renderTab(); break;
      case 'opp-clear-do':
        if (S.team.img && S.team.img.url) { try { URL.revokeObjectURL(S.team.img.url); } catch (e) { /* ignore */ } }
        S.team = { state: 'idle', members: [], err: '', img: null, ctl: null };
        S.bonus = { def: '', atk: '', clubDef: '', clubAtk: '', critDef: '', critAtk: '' }; S.mainsOff = {}; S.confirmOpp = false;
        renderTab(); toast('Analyse supprimée'); break;
      case 'theme':
        setTheme(d.th); renderTab(); break;
      case 'pick-do':
        if (S.modal && S.modal.type === 'pick') {
          if (S.modal.target === 'add') {
            var pl = S.db.players[d.id];
            S.team.members.push({ key: nextKey(), name: pl.name, pos: pl.pos, club: pl.club, seen: { def: null, atk: null }, unreadable: false, status: 'manual', id: pl.id, candidates: [] });
            if (S.team.state === 'idle' || S.team.state === 'error') { S.team.state = 'done'; S.team.err = ''; }
          } else { m = memberByKey(S.modal.target); if (m) { m.id = d.id; m.status = 'manual'; } }
        }
        closeModal(); renderTab(); break;
      case 'rename-ok':
        var val = ($('#rn') || {}).value || '';
        m = memberByKey(S.modal.key);
        if (m && val.trim()) {
          var mm = C.matchTeam(S.db.players, [{ name: val.trim(), club: m.club }])[0];
          m.name = val.trim(); m.unreadable = false; m.status = mm.status; m.id = mm.status === 'exact' ? mm.id : null; m.candidates = mm.candidates;
        }
        closeModal(); renderTab(); break;
      case 'modal-close': closeModal(); break;
      case 'hint': S.hintMode = d.v; renderTab(); break;
      case 'paste-go':
        var txt = ($('#paste-text') || {}).value || '';
        if (txt.trim()) startImport([new File([txt], 'texte collé.txt', { type: 'text/plain' })]);
        break;
      case 'job-close': S.jobs = S.jobs.filter(function (j) { if (j.id === d.job && j.ctl) j.ctl.abort(); return j.id !== d.job; }); renderTab(); break;
      case 'job-stop': job = S.jobs.filter(function (j) { return j.id === d.job; })[0]; if (job && job.ctl) job.ctl.abort(); break;
      case 'unk':
        job = S.jobs.filter(function (j) { return j.id === d.job; })[0]; if (job) { C.resolveUnknown(job.rows, d.stat); job.hint = d.stat; } renderTab(); break;
      case 'decide':
        job = S.jobs.filter(function (j) { return j.id === d.job; })[0];
        if (job) { if (job.decisions[d.i] === d.v) delete job.decisions[d.i]; else job.decisions[d.i] = d.v; }
        renderTab(); break;
      case 'keep':
        job = S.jobs.filter(function (j) { return j.id === d.job; })[0];
        if (job) { var kk = d.i + ':' + d.stat; if (job.keepOld[kk]) delete job.keepOld[kk]; else job.keepOld[kk] = true; }
        renderTab(); break;
      case 'job-save': job = S.jobs.filter(function (j) { return j.id === d.job; })[0]; if (job) saveJob(job); break;
      case 'filter': S.filter = d.v; S.limit = 60; renderTab(); break;
      case 'more-players': S.limit += 100; $('#plist').innerHTML = renderPlayerList(); break;
      case 'edit-player': S.modal = { type: 'edit', player: C.clonePlayer(S.db.players[d.id]), isNew: false }; renderModal(); break;
      case 'new-player': S.modal = { type: 'edit', player: { id: C.randomId(CHUNKS), name: '', pos: null, club: null, def: null, atk: null, src: {}, hist: [] }, isNew: true }; renderModal(); break;
      case 'edit-save': saveEdit(); break;
      case 'edit-del': S.modal.confirmDel = true; renderModal(); break;
      case 'edit-del-no': S.modal.confirmDel = false; renderModal(); break;
      case 'edit-del-do':
        var did = S.modal.player.id, cs = {}; cs[chunkOf(did)] = 1;
        delete S.db.players[did]; persist({ chunks: cs }); closeModal(); renderTab(); break;
      case 'dups': S.dup = C.findDuplicates(S.db.players); renderTab(); break;
      case 'dups-close': S.dup = null; renderTab(); break;
      case 'merge':
        var g = S.dup[+d.g]; if (!g) break;
        var keep = S.db.players[g[0]], cs2 = {}; cs2[chunkOf(g[0])] = 1;
        g.slice(1).forEach(function (id) { keep = C.mergePlayers(keep, S.db.players[id]); cs2[chunkOf(id)] = 1; delete S.db.players[id]; });
        S.db.players[g[0]] = keep; persist({ chunks: cs2 });
        S.dup = C.findDuplicates(S.db.players); renderTab(); break;
      case 'save-rules': {
        var mp = numOrNull($('#r-main').value), sp = numOrNull($('#r-sup').value);
        if (mp == null || sp == null || mp < 0 || sp < 0) { S.note = 'Entrez des pourcentages valides.'; break; }
        S.db.rules = { mainPct: mp, supportPct: sp, rounding: $('#r-round').value };
        persist({ rules: true }); S.note = ''; renderTab(); toast('Règle enregistrée'); break;
      }
      case 'reset-rules': S.db.rules = Object.assign({}, C.DEFAULT_RULES); persist({ rules: true }); renderTab(); toast('Règle remise à 100 % / 25 %'); break;
      case 'export': exportBackup(); break;
      case 'reset-ask': S.confirmReset = true; renderTab(); break;
      case 'reset-no': S.confirmReset = false; renderTab(); break;
      case 'reset-do':
        S.db.players = {}; S.db.imports = []; S.db.floors = { def: null, atk: null }; S.confirmReset = false; S.team.members = [];
        persist({ all: true, imports: true }).then(function () {
          if (dbh) { var seq = Promise.resolve(); for (var i = 0; i < CHUNKS; i++) (function (c) { seq = seq.then(function () { return dbh.doc('p/c' + (c < 10 ? '0' : '') + c).delete(); }); })(i); return seq; }
        }).catch(function () { /* ignore */ });
        renderTab(); toast('Base effacée'); break;
    }
  }

  function saveEdit() {
    var m = S.modal, p = m.player;
    var name = $('#e-name').value.trim();
    if (!name) { toast('Entrez un nom'); return; }
    var def = numOrNull($('#e-def').value), atk = numOrNull($('#e-atk').value);
    var date = new Date().toISOString();
    if (!p.hist) p.hist = []; if (!p.src) p.src = {};
    if (!m.isNew) {
      var old = S.db.players[p.id];
      [['def', def], ['atk', atk]].forEach(function (x) {
        if (old[x[0]] !== x[1]) { p.hist.push({ stat: x[0], old: old[x[0]], now: x[1], date: date, src: 'correction manuelle' }); p.src[x[0]] = x[1] == null ? '' : 'saisie manuelle'; }
      });
    } else {
      if (def != null) p.src.def = 'saisie manuelle'; if (atk != null) p.src.atk = 'saisie manuelle';
      p.created = date;
    }
    p.name = name; p.pos = $('#e-pos').value.trim() || null; p.club = $('#e-club').value.trim() || null; p.def = def; p.atk = atk; p.updated = date;
    S.db.players[p.id] = p;
    var cs = {}; cs[chunkOf(p.id)] = 1; persist({ chunks: cs });
    closeModal(); renderTab(); toast('Joueur enregistré');
  }

  var toastTimer = null;
  function toast(msg) {
    var t = $('#toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 2200);
  }

  function onInput(ev) {
    var el = ev.target;
    if (el.id === 'q') { S.q = el.value; S.limit = 60; $('#plist').innerHTML = renderPlayerList(); return; }
    if (el.id === 'pick-q' && S.modal) { S.modal.q = el.value; $('#pick-list').innerHTML = pickList(S.modal); return; }
    if (el.getAttribute('data-field') === 'bonus' && isMineEl(el)) {
      enterMine(); S.bonus[el.getAttribute('data-name')] = el.value; leaveMine(); saveMine(); refreshDuel(); return;
    }
    if (el.getAttribute('data-field') === 'bonus') {
      S.bonus[el.getAttribute('data-name')] = el.value; saveOppSoon();
      var r = $('#results'); if (r) r.innerHTML = renderResults();
    }
  }
  function onChange(ev) {
    var el = ev.target;
    if (el.id === 'shot-input' && el.files && el.files[0]) { analyseScreenshot(el.files[0], false); el.value = ''; }
    else if (el.id === 'mine-shot-input' && el.files && el.files[0]) { analyseScreenshot(el.files[0], false, true); el.value = ''; }
    else if (el.id === 'file-input' && el.files && el.files.length) { startImport(Array.prototype.slice.call(el.files)); el.value = ''; }
    else if (el.id === 'backup-input' && el.files && el.files[0]) { restoreBackup(el.files[0]); el.value = ''; }
    else if (el.getAttribute('data-field') === 'main' && isMineEl(el)) {
      enterMine(); var k0 = el.getAttribute('data-key'); if (el.checked) delete S.mainsOff[k0]; else S.mainsOff[k0] = true; leaveMine(); saveMine(); refreshDuel();
    }
    else if (el.getAttribute('data-field') === 'main') {
      var k = el.getAttribute('data-key');
      if (el.checked) delete S.mainsOff[k]; else S.mainsOff[k] = true; saveOppSoon();
      var r = $('#results'); if (r) r.innerHTML = renderResults();
    }
  }

  /* ---------- Démarrage ---------- */
  function boot() {
    document.addEventListener('click', onClick);
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') { clearTimeout(oppTimer); saveOpp(); } });
    window.addEventListener('pagehide', function () { clearTimeout(oppTimer); saveOpp(); });
    document.addEventListener('input', onInput);
    document.addEventListener('change', onChange);
    renderTab();
    initStorage().then(function () { return loadMine(); }).then(function () { return loadOpp(); }).then(function () { S.ready = true; renderTab(); }).catch(function () { S.ready = true; renderTab(); });
  }
  window.SnatchApp = { fondThumb: fondThumb, fondFeatures: fondFeatures, fondPredict: fondPredict, readCardFond: readCardFond, nameCanvas: nameCanvas, ocrText: ocrText, readCardSkills: readCardSkills, skSlots: skSlots, findCardStrips: findCardStrips, findProfileCards: findProfileCards, completeGrid: completeGrid, tagCanvas: tagCanvas, bitmapCanvas: bitmapCanvas, S: S, C: C, startImport: startImport, saveJob: saveJob, jobReport: jobReport, renderTab: renderTab, analyseScreenshot: analyseScreenshot, teamCalc: teamCalc, effStats: effStats, boot: boot };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();

</script>
</body></html>
